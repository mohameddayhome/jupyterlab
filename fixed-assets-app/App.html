<script>
(function () {
  'use strict';

  /* ======================= State & helpers ======================= */
  var S = { token: '', b: null, lang: 'ar', page: 'dashboard', view: {}, data: {}, grids: {}, busy: 0, info: {} };
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };

  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function T(ar, en) { return S.lang === 'ar' ? ar : en; }
  function L(o) { return o ? (S.lang === 'ar' ? (o.ar || o.en) : (o.en || o.ar)) : ''; }
  function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9؀-ۿ]/g, ''); }
  function low(s) { return String(s === undefined || s === null ? '' : s).trim().toLowerCase(); }
  function jsArg(v) { return esc(JSON.stringify(String(v === undefined || v === null ? '' : v))); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function pad(n) { return ('0' + n).slice(-2); }
  function dateStr(d) { d = new Date(d.getTime() + 300000); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtNum(v, dec) {
    if (v === '' || v === null || v === undefined || isNaN(Number(v))) return v === undefined || v === null ? '' : String(v);
    var d = dec === undefined ? 2 : dec;
    return Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function parseNum(v) { v = String(v || '').replace(/[\s,]/g, ''); return v === '' ? '' : v; }
  function initials(name) {
    var p = String(name || '?').trim().split(/\s+/);
    return ((p[0] || '?').charAt(0) + (p[1] ? p[1].charAt(0) : (p[0] || '').charAt(1) || '')).toUpperCase();
  }
  function can(page, act) { return !!(S.b && S.b.perms[page] && S.b.perms[page][act || 'view']); }
  function sch(e) { return S.b.schemas[e]; }
  function fld(e, k) { return sch(e).fields.filter(function (f) { return f.k === k; })[0]; }
  function keyObj(e, r) { var o = {}; sch(e).key.forEach(function (k) { o[k] = r[k]; }); return o; }
  function keyStr(e, r) { return sch(e).key.map(function (k) { return low(r[k]); }).join('\u0001'); }
  function findRec(e, key) { return (S.data[e] || []).filter(function (r) { return keyStr(e, r) === key; })[0]; }

  /* ======================= Icons ======================= */
  var IC = {
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    home: '<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
    box: '<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>',
    book: '<path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/>',
    journal: '<path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/>',
    truck: '<path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
    save: '<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3M8 14h8v7H8z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
    refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
    upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
    download: '<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',
    check: '<path d="M5 12l5 5L20 7"/>',
    send: '<path d="M4 12l16-8-6 16-3-7z"/>',
    undo: '<path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/>',
    back: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    up: '<path d="M6 15l6-6 6 6"/>',
    search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
    block: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 11-4.7M15 15l6 6M21 15l-6 6"/>',
    unblock: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 11-4.7M15 18l2 2 4-4"/>',
    logout: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    excel: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/>',
    folder: '<path d="M3 6h6l2 2h10v11H3z"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/>',
    tree: '<rect x="9" y="3" width="6" height="4" rx="1"/><rect x="3" y="17" width="6" height="4" rx="1"/><rect x="15" y="17" width="6" height="4" rx="1"/><path d="M12 7v5M6 17v-5h12v5"/>',
    pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
  };
  function icon(n, cls) {
    return '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (IC[n] || '') + '</svg>';
  }

  /* ======================= Server calls ======================= */
  function busy(on) {
    S.busy += on ? 1 : -1;
    $('#busy').classList.toggle('hidden', S.busy <= 0);
  }
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    busy(true);
    return new Promise(function (resolve, reject) {
      var r = google.script.run
        .withSuccessHandler(function (x) { busy(false); resolve(x); })
        .withFailureHandler(function (e) {
          busy(false);
          var m = (e && e.message) || String(e);
          if (m.indexOf('AUTH:') >= 0) {
            m = m.replace(/^.*?AUTH:\s*/, '');
            if (S.token) { localLogout(m); }
          }
          reject(new Error(m));
        });
      r[fn].apply(r, args);
    });
  }
  function fail(e) { toast((e && e.message) || String(e), 'err'); }

  /* ======================= UI primitives ======================= */
  function toast(msg, type) {
    var d = document.createElement('div');
    d.className = 'toast ' + (type || '');
    d.textContent = msg;
    $('#toasts').appendChild(d);
    setTimeout(function () { d.remove(); }, type === 'err' ? 6500 : 3500);
  }

  function modal(title, body, foot, opts) {
    opts = opts || {};
    $('#modal').innerHTML = '<div class="overlay"><div class="dialog ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="dh"><h2>' + esc(title) + '</h2>' + (opts.locked ? '' : '<button class="ib" onclick="FA.closeModal()" title="' + T('إغلاق', 'Close') + '">' + icon('close') + '</button>') + '</div>' +
      '<div class="db">' + body + '</div><div class="df">' + (foot || '') + '</div></div></div>';
    var first = $('#modal input:not([readonly]):not([type=checkbox]), #modal select:not([disabled])');
    if (first) setTimeout(function () { first.focus(); }, 30);
  }
  function closeModal() { $('#modal').innerHTML = ''; }

  function confirmBox(msg, okLabel, danger) {
    return new Promise(function (resolve) {
      FA._confirm = function (v) { closeModal(); resolve(v); };
      modal(T('تأكيد', 'Confirm'), '<p>' + esc(msg) + '</p>',
        '<button class="btn ' + (danger ? 'red' : 'pri') + '" onclick="FA._confirm(true)">' + esc(okLabel || T('موافق', 'OK')) + '</button>' +
        '<button class="btn" onclick="FA._confirm(false)">' + T('إلغاء', 'Cancel') + '</button>');
    });
  }

  function apane(btns, extra) {
    return '<div class="apane"><div class="bar">' + btns.filter(Boolean).map(function (b) {
      if (b === '|') return '<span class="sep"></span>';
      return '<button class="abtn ' + (b.cls || '') + '" ' + (b.dis ? 'disabled' : '') + ' onclick="' + b.on + '">' + icon(b.icon, b.icon === 'back' ? 'flip-rtl' : '') + '<span>' + esc(T(b.ar, b.en)) + '</span></button>';
    }).join('') + '</div>' + (extra || '') + '</div>';
  }

  function phead(sub, title) {
    return '<div class="phead"><div class="sub">' + sub + '</div><h1>' + title + '</h1></div>';
  }

  function badge(kind, v) {
    var map = {
      book: { Open: 'b-ok', NoAcquisition: 'b-gray', Suspended: 'b-warn', Closed: 'b-gray', Sold: 'b-err', Scrapped: 'b-err' },
      journal: { Draft: 'b-gray', Approved: 'b-info', Posted: 'b-ok', Mixed: 'b-warn' }
    };
    var opts = kind === 'book' ? fld('books', 'STATUS').opts : fld('journal', 'STATUS').opts;
    var o = opts.filter(function (x) { return x.v === v; })[0];
    return v ? '<span class="badge ' + ((map[kind] || {})[v] || 'b-gray') + '">' + esc(o ? L(o) : v) + '</span>' : '';
  }

  /* ======================= Lookups ======================= */
  function lookupKey(f, rec) { return f.lkBy ? (f.lkMap[rec[f.lkBy] || 'Ledger'] || '') : f.lk; }
  function lookupList(key, f, rec, all) {
    var r = S.b.refs, l;
    if (key === '@assets') l = r.assets;
    else if (key === '@vendors') l = r.vendors;
    else if (key === '@accounts') l = r.accounts.filter(function (x) { return !x.h; });
    else if (key === '@accountHeaders') l = r.accounts.filter(function (x) { return x.h; });
    else if (key === '@allAccounts') l = r.accounts;
    else if (key === '@books') {
      l = r.books.filter(function (b) { return all || !rec.FIXEDASSETNUMBER || low(b.a) === low(rec.FIXEDASSETNUMBER); });
    } else {
      l = S.b.lookups[key] || [];
      if (!all && f && f.parent && rec[f.parent]) {
        l = l.filter(function (x) { return !x.p || low(x.p) === low(rec[f.parent]); });
      }
    }
    return l || [];
  }
  function lookupName(key, v, rec) {
    if (!v) return '';
    var hit = lookupList(key, null, rec || {}, key !== '@books').filter(function (x) { return low(x.c) === low(v); })[0];
    if (!hit) return '';
    if (key === '@books') {
      var o = fld('books', 'STATUS').opts.filter(function (x) { return x.v === hit.n; })[0];
      return o ? L(o) : hit.n;
    }
    return hit.n;
  }
  function datalistOpts(key, f, rec) {
    var seen = {};
    return lookupList(key, f, rec).filter(function (x) { var k = low(x.c); if (seen[k]) return false; seen[k] = 1; return true; })
      .slice(0, 3000).map(function (x) { return '<option value="' + esc(x.c) + '">' + esc(x.n) + '</option>'; }).join('');
  }
  function displayVal(f, v) {
    if (v === '' || v === undefined || v === null) return '';
    if (f.type === 'select') { var o = f.opts.filter(function (x) { return x.v === v; })[0]; return o ? L(o) : v; }
    if (f.type === 'number') return fmtNum(v, f.dec);
    return String(v);
  }

  /* ======================= Forms ======================= */
  function fieldHtml(e, f, rec, isNew, ro) {
    var v = rec[f.k];
    if (v === undefined || v === null) v = '';
    var lock = ro || f.sys || f.calc || (!isNew && f.key);
    var id = 'f_' + f.k;
    var common = 'id="' + id + '" data-k="' + f.k + '" onchange="FA.fchg(this)"';
    var h;
    if (f.type === 'select') {
      h = '<select class="inp" ' + common + (lock ? ' disabled' : '') + '><option value=""></option>' +
        f.opts.map(function (o) { return '<option value="' + esc(o.v) + '"' + (o.v === v ? ' selected' : '') + '>' + esc(L(o)) + '</option>'; }).join('') + '</select>';
    } else if (f.type === 'lookup') {
      var key = lookupKey(f, rec);
      h = '<div class="lk"><input class="inp" ' + common + (lock ? ' readonly' : '') + ' list="dl_' + f.k + '" value="' + esc(v) + '" autocomplete="off" dir="ltr" oninput="FA.lkName(this)">' +
        '<input class="inp name" tabindex="-1" readonly value="' + esc(lookupName(key, v, rec)) + '"></div>' +
        '<datalist id="dl_' + f.k + '">' + (lock ? '' : datalistOpts(key, f, rec)) + '</datalist>';
    } else if (f.type === 'date') {
      h = '<input class="inp" type="date" ' + common + (lock ? ' readonly' : '') + ' value="' + esc(v) + '">';
    } else if (f.type === 'number') {
      h = '<input class="inp num" inputmode="decimal" ' + common + (lock ? ' readonly' : '') + ' value="' + esc(v === '' ? '' : fmtNum(v, f.dec)) + '">';
    } else if (f.type === 'textarea') {
      h = '<textarea class="inp" ' + common + (lock ? ' readonly' : '') + '>' + esc(v) + '</textarea>';
    } else {
      h = '<input class="inp" type="' + (f.type === 'email' ? 'email' : 'text') + '" ' + common + (lock ? ' readonly' : '') + ' value="' + esc(v) + '"' + (f.type === 'email' ? ' dir="ltr"' : ' dir="auto"') + '>';
    }
    return '<div class="fld"><label for="' + id + '" title="' + esc(f.en) + '"><bdi>' + esc(L(f)) + '</bdi>' +
      (f.req && !lock ? '<span class="req">*</span>' : '') + (S.lang === 'ar' ? '<small><bdi>' + esc(f.en) + '</bdi></small>' : '') + '</label>' + h + '</div>';
  }

  function formHtml(e, rec, isNew, ro, opts) {
    opts = opts || {};
    var s = sch(e);
    return '<div data-form="' + e + '" data-new="' + (isNew ? 1 : 0) + '">' + s.sections.map(function (sec) {
      var fields = s.fields.filter(function (f) { return f.sec === sec.id && (opts.hide || []).indexOf(f.k) < 0; });
      var hidden = s.fields.filter(function (f) { return f.sec === sec.id && (opts.hide || []).indexOf(f.k) >= 0; })
        .map(function (f) { return '<input type="hidden" data-k="' + f.k + '" value="' + esc(rec[f.k]) + '">'; }).join('');
      if (!fields.length || (sec.id === 'wf' && isNew)) return '';
      var groups = sec.groups.map(function (g) {
        var fs = fields.filter(function (f) { return f.grp === g.id; });
        if (!fs.length) return '';
        return '<div class="fgroup">' + (opts.flat ? '' : '<h5>' + esc(L(g)) + '</h5>') + fs.map(function (f) { return fieldHtml(e, f, rec, isNew, ro); }).join('') + '</div>';
      }).join('');
      var sum = isNew ? '' : fields.filter(function (f) { return f.sum && rec[f.k] !== '' && rec[f.k] !== undefined; })
        .map(function (f) { return '<span>' + esc(displayVal(f, rec[f.k])) + '</span>'; }).join('');
      return '<div class="card ftab" data-sec="' + sec.id + '"><div class="ftab-h" onclick="FA.toggleTab(this)"><h3>' + esc(L(sec)) + '</h3>' +
        '<div class="sum">' + sum + '</div><span class="chev">' + icon('up') + '</span></div><div class="ftab-b">' + hidden + groups + '</div></div>';
    }).join('') + '</div>';
  }

  function readForm(form) {
    var o = {};
    $$('[data-k]', form).forEach(function (el) {
      var k = el.getAttribute('data-k');
      o[k] = el.classList.contains('num') ? parseNum(el.value) : el.value;
    });
    return o;
  }

  function setVal(form, k, v) {
    var el = $('[data-k="' + k + '"]', form);
    if (!el) return;
    var f = fld(form.getAttribute('data-form'), k);
    el.value = f && f.type === 'number' && v !== '' ? fmtNum(v, f.dec) : v;
    if (f && f.type === 'lookup') updateLkName(el);
  }

  function updateLkName(el) {
    var form = el.closest('[data-form]');
    var e = form.getAttribute('data-form');
    var f = fld(e, el.getAttribute('data-k'));
    var nm = el.parentNode.querySelector('.name');
    if (nm) nm.value = lookupName(lookupKey(f, readForm(form)), el.value, readForm(form));
  }

  function rebuildList(form, k) {
    var e = form.getAttribute('data-form');
    var f = fld(e, k);
    var dl = $('#dl_' + k);
    if (dl && f) dl.innerHTML = datalistOpts(lookupKey(f, readForm(form)), f, readForm(form));
  }

  function validateForm(form) {
    var e = form.getAttribute('data-form');
    var ok = true;
    $$('[data-k]', form).forEach(function (el) {
      var f = fld(e, el.getAttribute('data-k'));
      var bad = f && f.req && !f.sys && !f.calc && String(el.value).trim() === '';
      if (f && f.type === 'number' && el.value !== '' && isNaN(Number(parseNum(el.value)))) bad = true;
      el.classList.toggle('err', !!bad);
      if (bad) ok = false;
    });
    if (!ok) toast(T('يرجى تعبئة الحقول المطلوبة بشكل صحيح', 'Please fill in the required fields correctly'), 'err');
    return ok;
  }

  var DEP_TYPES = { Depreciation: 1, DepreciationAdj: 1, ExtraordinaryDepreciation: 1 };
  var DISPOSAL_TYPES = { DisposalSale: 1, DisposalScrap: 1 };
  function refFind(list, code) { return code ? (list || []).filter(function (x) { return low(x.c) === low(code); })[0] : null; }

  function fchg(el) {
    var form = el.closest('[data-form]');
    var e = form.getAttribute('data-form');
    var k = el.getAttribute('data-k');
    var f = fld(e, k);
    el.classList.remove('err');
    if (f.type === 'lookup') updateLkName(el);
    if (f.type === 'number' && el.value !== '' && !isNaN(Number(parseNum(el.value)))) el.value = fmtNum(parseNum(el.value), f.dec);

    // الشجرة: اختيار المستوى الأدنى يملأ المستويات الأعلى تلقائياً
    if (f.up) {
      var item = refFind(S.b.lookups[f.lk], el.value);
      var upF = fld(e, f.up), upEl = $('[data-k="' + f.up + '"]', form);
      if (item && item.p) { setVal(form, f.up, item.p); if (upEl) fchg(upEl); }
      else if (!el.value && upF && upF.calc) { setVal(form, f.up, ''); if (upEl) fchg(upEl); }
    }

    if (e === 'assets' && k === 'FIXEDASSETGROUPID') {
      var g = refFind(S.b.refs.groups, el.value);
      setVal(form, 'ASSETACCOUNT', g ? g.a : '');
    }

    var rec = readForm(form);
    if (e === 'books') {
      if (k === 'SERVICELIFE' && rec.SERVICELIFE !== '') {
        var per = Math.round(Number(rec.SERVICELIFE) * 12);
        var isNew = form.getAttribute('data-new') === '1';
        if (isNew || !rec.DEPRECIATIONPERIODSREMAINING || parseNum(rec.DEPRECIATIONPERIODSREMAINING) === parseNum(rec.DEPRECIATIONPERIODS)) setVal(form, 'DEPRECIATIONPERIODSREMAINING', per);
        setVal(form, 'DEPRECIATIONPERIODS', per);
      }
      if (k === 'DEPRECIATIONPERIODS' && rec.DEPRECIATIONPERIODS !== '') setVal(form, 'SERVICELIFE', Math.round(Number(rec.DEPRECIATIONPERIODS) / 12 * 100) / 100);
    }

    if (e === 'journal') {
      if (k === 'FIXEDASSETNUMBER') {
        var a = refFind(S.b.refs.assets, el.value);
        setVal(form, 'ASSETNAME', a ? a.n : '');
        rebuildList(form, 'BOOKID');
        if (a && !rec.OFFSET_OPERATINGUNIT && !rec.OFFSET_SUB2_OPERATINGUNIT) {
          setVal(form, 'OFFSET_OPERATINGUNIT', a.ou); setVal(form, 'OFFSET_SUB1_OPERATINGUNIT', a.s1); setVal(form, 'OFFSET_SUB2_OPERATINGUNIT', a.s2);
        }
      }
      if (k === 'VENDORACCOUNT') {
        var v = refFind(S.b.refs.vendors, el.value);
        if (v && v.acc) { setVal(form, 'OFFSETACCOUNT', v.acc); form._autoOffset = ''; }
        else if (v) toast(T('المورد ليس له حساب في دليل الحسابات', 'This vendor has no ledger account'), 'err');
      }
      if (k === 'DEBITAMOUNT' && rec.DEBITAMOUNT !== '' && Number(rec.DEBITAMOUNT) > 0) setVal(form, 'CREDITAMOUNT', '');
      if (k === 'CREDITAMOUNT' && rec.CREDITAMOUNT !== '' && Number(rec.CREDITAMOUNT) > 0) setVal(form, 'DEBITAMOUNT', '');
      jDefaults(form, k);
    }
  }

  /** سطر اليومية: حساب الأصل من المجموعة + الحساب المقابل الافتراضي حسب نوع المعاملة. */
  function jDefaults(form, k) {
    var rec = readForm(form);
    var a = refFind(S.b.refs.assets, rec.FIXEDASSETNUMBER);
    var g = a ? refFind(S.b.refs.groups, a.g) : null;

  function schemaCols(e) {
    return sch(e).fields.filter(function (f) { return f.list; }).map(function (f) {
      var c = { k: f.k, label: L(f), num: f.type === 'number', text: function (r) { return displayVal(f, r[f.k]); } };
      if (f.k === 'STATUS') c.html = function (r) { return badge(e === 'books' ? 'book' : 'journal', r.STATUS); };
      if (f.type === 'number' && /AMOUNT|PRICE/.test(f.k)) c.total = true;
      return c;

  function grid(gid, cfg) {
    var old = S.grids[gid] || {};
    S.grids[gid] = Object.assign({ q: old.q || '', sort: old.sort === undefined ? -1 : old.sort, dir: old.dir || 1, sel: old.sel || {}, init: old.init }, cfg);
    return '<div class="gridtools"><div class="search">' + icon('search') + '<input class="inp" placeholder="' + T('تصفية', 'Filter') + '" value="' + esc(S.grids[gid].q) +
      '" oninput="FA.gq(\'' + gid + '\', this.value)"></div>' + (cfg.tools || '') + '</div><div id="g_' + gid + '"></div>';
  }

  function cellText(c, r) { return c.text ? c.text(r) : (r[c.k] === undefined ? '' : r[c.k]); }

  function gridRender(gid) {
    var g = S.grids[gid];
    var el = document.getElementById('g_' + gid);
    if (!g || !el) return;
    var rows = g.rows();
    if (g.q) {
      var q = g.q.toLowerCase();
      rows = rows.filter(function (r) { return g.cols.some(function (c) { return String(cellText(c, r)).toLowerCase().indexOf(q) >= 0 || String(r[c.k] || '').toLowerCase().indexOf(q) >= 0; }); });
    }
    if (g.sort >= 0) {
      var c = g.cols[g.sort];
      rows = rows.slice().sort(function (a, b) {
        var x = a[c.k], y = b[c.k];
        if (c.num) return ((Number(x) || 0) - (Number(y) || 0)) * g.dir;
        return String(x === undefined ? '' : x).localeCompare(String(y === undefined ? '' : y), undefined, { numeric: true }) * g.dir;
      });
    }
    g.visible = rows;
    var shown = rows.slice(0, 1500);
    var selCount = Object.keys(g.sel).length;
    var allSel = shown.length && shown.every(function (r) { return g.sel[g.key(r)]; });
    var h = '<div class="gridwrap"><table class="grid"><thead><tr>' +
      (g.select ? '<th class="ck"><input type="checkbox" ' + (allSel ? 'checked' : '') + ' onchange="FA.gselAll(\'' + gid + '\', this.checked)"></th>' : '') +
      g.cols.map(function (c, i) {
        return '<th class="' + (c.num ? 'n' : '') + '" onclick="FA.gsort(\'' + gid + '\',' + i + ')">' + esc(c.label) +
          (g.sort === i ? '<span class="arr">' + (g.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>';
      }).join('') + '</tr></thead><tbody>';
    if (!shown.length) {
      h += '<tr><td colspan="' + (g.cols.length + 1) + '"><div class="empty">' + icon('folder') + T('لا توجد بيانات لعرضها', "We didn't find anything to show here.") + '</div></td></tr>';
    }
    shown.forEach(function (r, i) {
      var k = g.key(r);
      h += '<tr class="' + (g.sel[k] ? 'sel' : '') + '">' + (g.select ? '<td class="ck"><input type="checkbox" ' + (g.sel[k] ? 'checked' : '') + ' onchange="FA.gsel(\'' + gid + '\',' + i + ', this.checked)"></td>' : '') +
        g.cols.map(function (c, ci) {
          var inner = c.html ? c.html(r) : esc(cellText(c, r));
          if (ci === 0 && g.open) inner = '<a onclick="FA.gopen(\'' + gid + '\',' + i + ')">' + (inner || '—') + '</a>';
          return '<td class="' + (c.num ? 'n' : '') + '" title="' + esc(cellText(c, r)) + '"><bdi>' + inner + '</bdi></td>';
        }).join('') + '</tr>';
    });
    h += '</tbody>';
    if (g.cols.some(function (c) { return c.total; }) && shown.length) {
      h += '<tfoot><tr>' + (g.select ? '<td></td>' : '') + g.cols.map(function (c, i) {
        if (i === 0) return '<td>' + T('الإجمالي', 'Total') + '</td>';
        if (!c.total) return '<td></td>';
        var sum = rows.reduce(function (a, r) { return a + (Number(r[c.k]) || 0); }, 0);
        return '<td class="n">' + fmtNum(sum, c.dec === undefined ? 3 : c.dec) + '</td>';
      }).join('') + '</tr></tfoot>';
    }
    h += '</table></div><div class="gridfoot">' + T('عدد السجلات: ', 'Records: ') + rows.length +
      (rows.length > shown.length ? ' — ' + T('يتم عرض أول 1500 سجل، استخدم التصفية', 'Showing first 1500, use the filter') : '') +
      (selCount ? ' — ' + T('المحدد: ', 'Selected: ') + selCount : '') + '</div>';
    el.innerHTML = h;
  }

  var qTimer;
  function gq(gid, v) { S.grids[gid].q = v; clearTimeout(qTimer); qTimer = setTimeout(function () { gridRender(gid); }, 200); }
  function gsort(gid, i) { var g = S.grids[gid]; if (g.sort === i) g.dir = -g.dir; else { g.sort = i; g.dir = 1; } gridRender(gid); }
  function gsel(gid, i, on) { var g = S.grids[gid]; var k = g.key(g.visible[i]); if (on) g.sel[k] = 1; else delete g.sel[k]; gridRender(gid); }
  function gselAll(gid, on) { var g = S.grids[gid]; g.sel = {}; if (on) g.visible.slice(0, 1500).forEach(function (r) { g.sel[g.key(r)] = 1; }); gridRender(gid); }
  function gopen(gid, i) { var g = S.grids[gid]; g.open(g.visible[i]); }

  /* ======================= Import / Export ======================= */
  function aliasMap(e) {
    var m = {};
    sch(e).fields.forEach(function (f) {
      [f.k, f.en, f.ar].concat(f.aliases || []).forEach(function (a) { var n = norm(a); if (n && !m[n]) m[n] = f.k; });
    });
    return m;
  }

  function exportRows(e, rows, name) {
    if (typeof XLSX === 'undefined') return toast(T('مكتبة Excel غير محمّلة', 'Excel library not loaded'), 'err');
    var keys = sch(e).fields.map(function (f) { return f.k; });
    var data = rows.map(function (r) { var o = {}; keys.forEach(function (k) { o[k] = r[k] === undefined ? '' : r[k]; }); return o; });
    var ws = XLSX.utils.json_to_sheet(data, { header: keys });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, e.slice(0, 30));
    XLSX.writeFile(wb, (name || e) + '_' + today() + '.xlsx');
  }

  function importStart(e, extra) {
    if (typeof XLSX === 'undefined') return toast(T('مكتبة Excel غير محمّلة', 'Excel library not loaded'), 'err');
    S.importFor = { e: e, extra: extra || {} };
    var fi = $('#fileInput');
    fi.value = '';
    fi.click();
  }

  async function onImportFile(file) {
    var e = S.importFor.e;
    try {
      var wb = /\.csv$/i.test(file.name)
        ? XLSX.read(await file.text(), { type: 'string', cellDates: true, raw: false })
        : XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
      var map = aliasMap(e), best = { row: 0, hits: -1 };
      for (var i = 0; i < Math.min(15, aoa.length); i++) {
        var hits = aoa[i].filter(function (h) { return map[norm(h)]; }).length;
        if (hits > best.hits) best = { row: i, hits: hits };
      }
      var head = aoa[best.row] || [];
      var colMap = head.map(function (h) { return map[norm(h)] || null; });
      var rows = aoa.slice(best.row + 1).filter(function (r) { return r.some(function (c) { return c !== '' && c !== null; }); }).map(function (r) {
        var o = {};
        colMap.forEach(function (k, ci) {
          if (!k) return;
          var v = r[ci];
          if (v instanceof Date) v = dateStr(v);
          o[k] = v;
        });
        Object.keys(S.importFor.extra).forEach(function (k) { if (o[k] === undefined || o[k] === '') o[k] = S.importFor.extra[k]; });
        return o;
      });
      var mapped = head.map(function (h, ci) { return colMap[ci] ? '<li>' + esc(h) + ' ← <b>' + esc(L(fld(e, colMap[ci]))) + '</b></li>' : ''; }).join('');
      var ignored = head.filter(function (h, ci) { return h !== '' && !colMap[ci]; });
      var missingKey = sch(e).key.filter(function (k) { return colMap.indexOf(k) < 0 && !S.importFor.extra[k] && sch(e).autoId !== k; });
      S.importRows = rows;
      modal(T('استيراد: ', 'Import: ') + L(sch(e).title),
        '<p>' + T('الملف: ', 'File: ') + '<b>' + esc(file.name) + '</b> — ' + T('عدد الأسطر: ', 'Rows: ') + '<b>' + rows.length + '</b></p>' +
        (missingKey.length ? '<div class="note">' + T('أعمدة المفتاح غير موجودة: ', 'Key columns missing: ') + esc(missingKey.join(', ')) + '</div>' : '') +
        '<p><b>' + T('الأعمدة المطابقة', 'Mapped columns') + '</b></p><ul>' + (mapped || '<li>—</li>') + '</ul>' +
        (ignored.length ? '<p class="sub" style="color:#605e5c">' + T('أعمدة سيتم تجاهلها: ', 'Ignored columns: ') + esc(ignored.join(', ')) + '</p>' : '') +
        '<div class="note">' + T('السجلات الموجودة (نفس المفتاح) سيتم تحديثها، والجديدة ستُضاف.', 'Existing records (same key) will be updated; new ones will be added.') + '</div>',
        '<button class="btn pri" onclick="FA.importRun()" ' + (rows.length && !missingKey.length ? '' : 'disabled') + '>' + icon('upload') + T('استيراد', 'Import') + '</button>' +
        '<button class="btn" onclick="FA.closeModal()">' + T('إلغاء', 'Cancel') + '</button>', { wide: true });
    } catch (err) { fail(err); }
  }

  async function importRun() {
    var e = S.importFor.e, rows = S.importRows || [];
    closeModal();
    var tot = { added: 0, updated: 0, errors: [] }, batch = '';
    try {
      for (var i = 0; i < rows.length; i += 500) {
        var r = await api('importRecords', S.token, e, rows.slice(i, i + 500), { offset: i, batch: batch });
        batch = r.batch || batch;
        tot.added += r.added; tot.updated += r.updated; tot.errors = tot.errors.concat(r.errors);
        toast(T('جاري الاستيراد... ', 'Importing... ') + Math.min(i + 500, rows.length) + '/' + rows.length);
      }
    } catch (err) { fail(err); }
    await load(e, true);
    refreshRefs();
    modal(T('نتيجة الاستيراد', 'Import result'),
      '<div class="kv"><span>' + T('أُضيف', 'Added') + '</span><b>' + tot.added + '</b></div>' +
      '<div class="kv"><span>' + T('حُدّث', 'Updated') + '</span><b>' + tot.updated + '</b></div>' +
      '<div class="kv"><span>' + T('أخطاء', 'Errors') + '</span><b>' + tot.errors.length + '</b></div>' +
      (tot.errors.length ? '<div class="errlist">' + tot.errors.slice(0, 300).map(function (x) { return T('سطر ', 'Row ') + x.row + ': ' + esc(x.msg); }).join('<br>') + '</div>' : ''),
      '<button class="btn pri" onclick="FA.closeModal()">' + T('تم', 'Done') + '</button>');
    render();
  }

  function compact(n) {
    var a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 0 : 1) + 'B';
    if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
    if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'K';
    return String(Math.round(n));
  }

  /** مخطط أعمدة SVG لسلسلة واحدة (قيمة الأصول) مع تلميح عند المرور. */
  function barChart(rows) {
    if (!rows.length) return '<div class="empty">' + T('لا توجد بيانات', 'No data') + '</div>';
    var max = Math.max.apply(null, rows.map(function (r) { return r.cost; })) || 1;
    var step = Math.pow(10, Math.floor(Math.log10(max)));
    var top = Math.ceil(max / step) * step;
    if (top / step < 3) { step = step / 2; top = Math.ceil(max / step) * step; }
    var W = Math.max(520, rows.length * 96 + 70), H = 280, padL = 60, padB = 52, padT = 22;
    var plotW = W - padL - 12, plotH = H - padB - padT;
    var bw = Math.min(56, plotW / rows.length * 0.55);
    var g = '';
    for (var v = 0; v <= top + 1e-9; v += step) {
      var y = padT + plotH - v / top * plotH;
      g += '<line x1="' + padL + '" x2="' + (W - 12) + '" y1="' + y + '" y2="' + y + '" stroke="#edebe9" stroke-width="1"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#605e5c">' + compact(v) + '</text>';
    }
    rows.forEach(function (r, i) {
      var cx = padL + plotW / rows.length * (i + 0.5);
      var h = Math.max(1, r.cost / top * plotH);
      var x = cx - bw / 2, y0 = padT + plotH, y1 = y0 - h, rad = Math.min(4, h, bw / 2);
      var path = 'M' + x + ',' + y0 + 'V' + (y1 + rad) + 'Q' + x + ',' + y1 + ' ' + (x + rad) + ',' + y1 + 'H' + (x + bw - rad) + 'Q' + (x + bw) + ',' + y1 + ' ' + (x + bw) + ',' + (y1 + rad) + 'V' + y0 + 'Z';
      var name = lookupName('OperatingUnit', r.ou);
      var tip = esc(r.ou + (name ? ' — ' + name : '')) + '|' + esc(T('قيمة الأصول: ', 'Assets value: ') + fmtNum(r.cost, 3)) + '|' +
        esc(T('مجمع الإهلاك: ', 'Accum. depreciation: ') + fmtNum(r.accum, 3)) + '|' + esc(T('صافي القيمة: ', 'Net book value: ') + fmtNum(r.nbv, 3)) + '|' + esc(T('عدد الأصول: ', 'Assets: ') + r.count);
      g += '<g class="bar" data-tip="' + tip + '"><rect x="' + (cx - plotW / rows.length / 2) + '" y="' + padT + '" width="' + (plotW / rows.length) + '" height="' + plotH + '" fill="transparent"/>' +
        '<path d="' + path + '" fill="#0f6cbd"/>' +
        '<text x="' + cx + '" y="' + (y1 - 6) + '" text-anchor="middle" font-size="11" fill="#323130">' + compact(r.cost) + '</text>' +
        '<text x="' + cx + '" y="' + (y0 + 16) + '" text-anchor="middle" font-size="12" fill="#201f1e" direction="ltr">' + esc(r.ou) + '</text>' +
        '<text x="' + cx + '" y="' + (y0 + 32) + '" text-anchor="middle" font-size="11" fill="#605e5c">' + esc(name.length > 16 ? name.slice(0, 15) + '…' : name) + '</text></g>';
    });
    g += '<line x1="' + padL + '" x2="' + (W - 12) + '" y1="' + (padT + plotH) + '" y2="' + (padT + plotH) + '" stroke="#8a8886" stroke-width="1"/>';
    return '<div class="chartwrap" dir="ltr"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:' + W + 'px" role="img" aria-label="' +
      esc(T('قيمة الأصول حسب الوحدة التشغيلية', 'Assets value by operating unit')) + '" onmousemove="FA.tip(event)" onmouseleave="FA.tip(null)">' + g + '</svg><div class="tooltip hidden" id="chartTip"></div></div>';
  }

  function tip(ev) {
    var t = $('#chartTip');
    if (!t) return;
    var gEl = ev && ev.target.closest ? ev.target.closest('g.bar') : null;
    if (!gEl) { t.classList.add('hidden'); return; }
    t.innerHTML = gEl.getAttribute('data-tip').split('|').map(function (x, i) { return i ? '<div>' + esc(x) + '</div>' : '<b>' + esc(x) + '</b>'; }).join('');
    var box = t.parentNode.getBoundingClientRect();
    t.classList.remove('hidden');
    var x = ev.clientX - box.left + 14, y = ev.clientY - box.top + 10;
    if (x + t.offsetWidth > box.width) x = ev.clientX - box.left - t.offsetWidth - 14;
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }

  /** عرض شجري لسلسلة أنواع (من الأعلى للأدنى). */
  function chainTree(chain, title) {
    var l = S.b.lookups;
    var item = function (x, inner) {
      return '<li><b dir="ltr">' + esc(x.c) + '</b> <span>' + esc(x.n) + '</span>' + (inner ? '<ul>' + inner + '</ul>' : '') + '</li>';
    };
    var level = function (i, parent) {
      if (i >= chain.length) return '';
      return (l[chain[i]] || []).filter(function (x) { return parent === null ? !x.p || !refFind(l[chain[i - 1]], x.p) : low(x.p) === low(parent); })
        .map(function (x) { return item(x, level(i + 1, x.c)); }).join('');
    };
    var html = (l[chain[0]] || []).map(function (x) { return item(x, level(1, x.c)); }).join('');
    for (var i = 1; i < chain.length; i++) {
      html += (l[chain[i]] || []).filter(function (x) { return !refFind(l[chain[i - 1]], x.p); })
        .map(function (x) { return item(x, '') .replace('</span>', '</span> <span class="badge b-warn">' + T('بدون أب', 'no parent') + '</span>'); }).join('');
    }
    return '<div class="card"><h4 style="margin:0;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px">' + esc(title) + '</h4><ul class="tree">' +
      (html || '<li class="empty">—</li>') + '</ul></div>';
  }

  function drawAccTree() {
    var el = $('#accTree');
    if (!el) return;
    var rows = (S.data.accounts || []).slice().sort(function (a, b) { return String(a.MAINACCOUNTID).localeCompare(String(b.MAINACCOUNTID), undefined, { numeric: true }); });
    var q = low(S.accQ);
    var match = function (r) { return !q || low(r.MAINACCOUNTID).indexOf(q) >= 0 || low(r.NAME).indexOf(q) >= 0; };
    var heads = rows.filter(function (r) { return r.ACCOUNTLEVEL === 'Header'; });
    var headIds = {};
    heads.forEach(function (h) { headIds[low(h.MAINACCOUNTID)] = 1; });
    var kids = function (id) { return rows.filter(function (r) { return r.ACCOUNTLEVEL !== 'Header' && low(r.PARENTACCOUNT) === low(id); }); };
    var orphans = rows.filter(function (r) { return r.ACCOUNTLEVEL !== 'Header' && !headIds[low(r.PARENTACCOUNT)]; });
    var typeName = function (r) { return displayVal(fld('accounts', 'MAINACCOUNTTYPE'), r.MAINACCOUNTTYPE); };
    var row = function (r, level, n) {
      var isHead = r.ACCOUNTLEVEL === 'Header';
      var closed = S.accClosed[low(r.MAINACCOUNTID)] && !q;
      return '<tr class="' + (isHead ? 'acc-h' : '') + '"><td><span style="display:inline-block;width:' + (level * 26) + 'px"></span>' +
        (isHead ? '<button class="ib" onclick="FA.accToggle(' + jsArg(low(r.MAINACCOUNTID)) + ')">' + (closed ? '▸' : '▾') + '</button>' : '<span style="display:inline-block;width:24px"></span>') +
        '<a onclick="FA.go(\'accounts\',{key:' + jsArg(low(r.MAINACCOUNTID)) + '})"><bdi>' + esc(r.MAINACCOUNTID) + '</bdi></a></td>' +
        '<td>' + (isHead ? '<b>' + esc(r.NAME) + '</b>' : esc(r.NAME)) + '</td>' +
        '<td>' + (isHead ? '<span class="badge b-info">' + T('رئيسي', 'Header') + (n !== undefined ? ' · ' + n : '') + '</span>' : '<span class="badge b-gray">' + T('فرعي', 'Posting') + '</span>') + '</td>' +
        '<td>' + esc(r.MAINACCOUNTCATEGORY) + '</td><td>' + esc(typeName(r)) + '</td></tr>';
    };
    var body = '';
    heads.forEach(function (h) {
      var ch = kids(h.MAINACCOUNTID);
      var vis = ch.filter(match);
      if (!match(h) && !vis.length) return;
      body += row(h, 0, ch.length);
      if (!(S.accClosed[low(h.MAINACCOUNTID)] && !q)) vis.forEach(function (c) { body += row(c, 1); });
    });
    var vo = orphans.filter(match);
    if (vo.length) {
      body += '<tr class="acc-h"><td colspan="5"><b>' + T('حسابات فرعية بدون حساب رئيسي', 'Posting accounts without a header') + '</b></td></tr>';
      vo.forEach(function (c) { body += row(c, 1); });
    }
    el.innerHTML = '<table class="grid"><thead><tr><th>' + T('رقم الحساب', 'Account number') + '</th><th>' + T('اسم الحساب', 'Account name') + '</th><th>' +
      T('المستوى', 'Level') + '</th><th>' + T('مجموعة الحساب', 'Account group') + '</th><th>' + T('نوع الحساب', 'Account type') + '</th></tr></thead><tbody>' +
      (body || '<tr><td colspan="5"><div class="empty">' + icon('folder') + T('لا توجد حسابات', 'No accounts') + '</div></td></tr>') + '</tbody></table>' +
      '<div class="gridfoot">' + T('رئيسي: ', 'Header: ') + heads.length + ' — ' + T('فرعي: ', 'Posting: ') + (rows.length - heads.length) + '</div>';
  }

  function depPayload() {
    var p = S.depParams;

      journalName: p.journalName, offsetAccount: p.offsetAccount };

  async function depCalc() {
    try {
      S.depResult = await api('depreciationProposal', S.token, depPayload());

      render();
    } catch (e) { fail(e); }

  async function depCreate() {
    var sel = selected('dep');
    if (!sel.length) return toast(T('حدد أصلاً واحداً على الأقل', 'Select at least one asset'));
    var total = sel.reduce(function (a, l) { return a + l.AMOUNT; }, 0);
    if (!S.depParams.offsetAccount && sel.some(function (l) { return !l.OFFSET; })) {
      return toast(T('بعض المجموعات ليس لها حساب مصروف إهلاك — حدده في مجموعة الأصل أو اختر حساباً احتياطياً', 'Some groups have no depreciation expense account — set it on the asset group or choose a fallback account'), 'err');
    }
    if (!(await confirmBox(T('إنشاء يومية إهلاك لـ ', 'Create a depreciation journal for ') + sel.length + T(' أصل بإجمالي ', ' assets totalling ') + fmtNum(total, 3) + '؟'))) return;
    try {
      var p = depPayload();
      p.only = sel.map(function (l) { return l.FIXEDASSETNUMBER; });
      var r = await api('createDepreciationJournal', S.token, p);
      toast(T('تم إنشاء اليومية ', 'Journal created ') + r.batch + ' — ' + r.count + T(' سطر', ' lines'), 'ok');
      S.depResult = null;
      S.data.journal = null;
      go('journal', { batch: r.batch });
    } catch (e) { fail(e); }
  }

  /** تصدير جدول عام (للتقارير) إلى Excel بعناوين الأعمدة الظاهرة. */
  function exportPlain(cols, rows, name) {
    if (typeof XLSX === 'undefined') return toast(T('مكتبة Excel غير محمّلة', 'Excel library not loaded'), 'err');
    var aoa = [cols.map(function (c) { return c.label; })].concat(rows.map(function (r) {
      return cols.map(function (c) { var v = r[c.k]; return c.num && v !== '' && !isNaN(Number(v)) ? Number(v) : (c.text ? c.text(r) : (v === undefined ? '' : v)); });
    }));
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Report');
    XLSX.writeFile(wb, name + '_' + today() + '.xlsx');
  }

  function repRegister() {
    var f = S.repF;
    return S.rep.register.filter(function (r) {
      return (!f.group || r.FIXEDASSETGROUPID === f.group) && (!f.ou || r.OPERATINGUNIT === f.ou) && (!f.location || r.LOCATION === f.location) && (!f.status || r.STATUS === f.status);
    });
  }

  function repSummary(dimK) {
    var f = S.repF, m = {}, total = 0;
    var seen = {};
    S.rep.register.forEach(function (r) {
      if (f.status && r.STATUS !== f.status) return;
      var k = low(r.FIXEDASSETNUMBER);
      if (seen[k] && low(r.BOOKID) !== 'general') return; // دفتر واحد لكل أصل
      seen[k] = 1;
      var c = r[dimK] || '-';
      var g = m[c] = m[c] || { CODE: c, COUNT: 0, ACQUISITIONPRICE: 0, ACCUMULATEDDEPRECIATION: 0, NETBOOKVALUE: 0 };
      g.COUNT++; g.ACQUISITIONPRICE += r.ACQUISITIONPRICE; g.ACCUMULATEDDEPRECIATION += r.ACCUMULATEDDEPRECIATION; g.NETBOOKVALUE += r.NETBOOKVALUE;
      total += r.ACQUISITIONPRICE;
    });
    return Object.keys(m).map(function (k) { var g = m[k]; g.PCT = total ? g.ACQUISITIONPRICE / total * 100 : 0; return g; })
      .sort(function (a, b) { return b.ACQUISITIONPRICE - a.ACQUISITIONPRICE; });
  }

  function repDep() {
    var f = S.repF;
    return S.rep.depreciation.filter(function (r) {
      return (!f.from || String(r.TRANSDATE) >= f.from) && (!f.to || String(r.TRANSDATE) <= f.to) && (!f.ou || r.OPERATINGUNIT === f.ou);
    });
  }

  function roleTemplate(role) {
    var p = {};
    S.b.permPages.forEach(function (pg) { p[pg] = {}; S.b.permActions.forEach(function (a) { p[pg][a] = false; }); });
    var set = function (pages, acts) { pages.forEach(function (pg) { acts.forEach(function (a) { p[pg][a] = true; }); }); };
    var data = ['assets', 'books', 'journal', 'vendors', 'masterdata'];
    if (role === 'SuperAdmin' || role === 'Admin') set(S.b.permPages, S.b.permActions);
    else if (role === 'Accountant') { set(data, ['view', 'add', 'edit']); set(['depreciation'], ['view', 'add']); set(['reports'], ['view']); }
    else set(data.concat(['reports']), ['view']);
    return p;
  }

      if (!guard) {

        if (can('users', 'edit')) acts += '<button class="ib yel" title="' + T('تعديل', 'Edit') + '" onclick="FA.userDlg(' + i + ')">' + icon('edit') + '</button>';
        acts += '<button class="ib blue" title="' + T('الصلاحيات', 'Permissions') + '" onclick="FA.userExpand(' + i + ')">' + icon('shield') + '</button>';
        if (can('users', 'edit')) acts += '<button class="ib navy" title="' + T('إعادة تعيين كلمة المرور', 'Reset password') + '" onclick="FA.resetPwDlg(' + i + ')">' + icon('key') + '</button>';
        if (can('users', 'delete') && !me) acts += '<button class="ib red" title="' + T('حذف', 'Delete') + '" onclick="FA.userDelete(' + i + ')">' + icon('trash') + '</button>';
      }
      return '<tr><td style="width:40px;text-align:center"><button class="expander" onclick="FA.userExpand(' + i + ')">+</button></td>' +
        '<td><div class="ucell"><span class="avatar">' + esc(initials(u.FULLNAME || u.USERNAME)) + '</span><div><b>' + esc(u.FULLNAME) + '</b><span class="meta">' + esc(u.USERNAME) +
        (u.LASTLOGIN ? ' · ' + T('آخر دخول ', 'last login ') + esc(u.LASTLOGIN) : '') + '</span></div></div></td>' +
        '<td>' + (u.EMAIL ? '<a href="mailto:' + esc(u.EMAIL) + '" style="text-decoration:underline">' + esc(u.EMAIL) + '</a>' : '') + '</td>' +
        '<td style="text-align:center">' + (isSA ? '<span class="badge b-info">' + esc(L(role)) + '</span>' : u.ROLE === 'Admin' ? '<span class="badge b-ok">' + esc(L(role)) + '</span>' : esc(L(role))) + '</td>' +
        '<td style="text-align:center">' + (u.STATUS === 'Active' ? '<span class="badge b-ok">' + T('نشط', 'Active') + '</span>' : '<span class="badge b-err">' + T('موقوف', 'Inactive') + '</span>') + '</td>' +
        '<td><div class="uacts">' + acts + '</div></td></tr>' +
        '<tr class="permrow hidden" id="perm_' + i + '"><td></td><td colspan="5">' + permTable(u.PERMS, true) + '</td></tr>';
    }).join('');
    $('#main').innerHTML = apane([
      can('users', 'add') && { icon: 'plus', ar: 'مستخدم جديد', en: 'New user', on: 'FA.userDlg(-1)' },
      { icon: 'refresh', ar: 'تحديث', en: 'Refresh', on: 'FA.render()' }
    ]) + phead(T('الإدارة', 'Administration'), T('المستخدمون والصلاحيات', 'Users & permissions')) +
      '<div class="content"><div class="card" style="overflow:auto"><table class="utable"><thead><tr><th></th><th>' + T('المستخدم', 'User') + ' ▲</th><th>' + T('البريد الإلكتروني', 'Email') + ' ▲</th><th>' +
      T('الدور', 'Role') + ' ▲</th><th>' + T('الحالة', 'Status') + ' ▲</th><th>' + T('الإجراءات', 'Actions') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function permTable(p, ro, lockAll) {
    return '<table class="permgrid"><thead><tr><th>' + T('الصفحة', 'Page') + '</th>' + S.b.permActions.map(function (a) { return '<th>' + esc(T(ACT_NAMES[a][0], ACT_NAMES[a][1])) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      S.b.permPages.map(function (pg) {
        return '<tr><td>' + esc(T(PAGE_NAMES[pg][0], PAGE_NAMES[pg][1])) + '</td>' + S.b.permActions.map(function (a) {
          var on = p && p[pg] && p[pg][a];
          return '<td>' + (ro ? (on ? '<span style="color:#107c10">✔</span>' : '<span style="color:#c8c6c4">—</span>') :
            '<input type="checkbox" data-pg="' + pg + '" data-a="' + a + '" ' + (on ? 'checked' : '') + (lockAll ? ' disabled' : '') + '>') + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }

  function userExpand(i) { $('#perm_' + i).classList.toggle('hidden'); }

  function userDlg(i) {
    var isNew = i < 0;
    var u = isNew ? { USERNAME: '', FULLNAME: '', EMAIL: '', ROLE: 'Viewer', STATUS: 'Active', PERMS: roleTemplate('Viewer') } : S.users[i];
    S.editUser = isNew ? null : u;
    var roles = Object.keys(S.b.roles).filter(function (r) { return r !== 'SuperAdmin' || S.b.user.role === 'SuperAdmin'; });
    var me = !isNew && u.USERNAME === S.b.user.username;
    modal(isNew ? T('مستخدم جديد', 'New user') : T('تعديل المستخدم', 'Edit user'),
      '<div class="ftab-b" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">' +
      '<div class="fld"><label>' + T('اسم المستخدم', 'User name') + '<span class="req">*</span></label><input class="inp" id="u_name" dir="ltr" value="' + esc(u.USERNAME) + '" ' + (isNew ? '' : 'readonly') + '></div>' +
      '<div class="fld"><label>' + T('الاسم الكامل', 'Full name') + '<span class="req">*</span></label><input class="inp" id="u_full" value="' + esc(u.FULLNAME) + '"></div>' +
      '<div class="fld"><label>' + T('البريد الإلكتروني', 'Email') + '</label><input class="inp" id="u_email" type="email" dir="ltr" value="' + esc(u.EMAIL) + '"></div>' +
      '<div class="fld"><label>' + T('الدور', 'Role') + '</label><select class="inp" id="u_role" onchange="FA.roleChanged(this.value)" ' + (me ? 'disabled' : '') + '>' +
      roles.map(function (r) { return '<option value="' + r + '" ' + (r === u.ROLE ? 'selected' : '') + '>' + esc(L(S.b.roles[r])) + '</option>'; }).join('') + '</select></div>' +
      (isNew ? '<div class="fld"><label>' + T('كلمة المرور', 'Password') + '<span class="req">*</span></label><input class="inp" id="u_pw" type="password" dir="ltr" autocomplete="new-password"></div>' : '') +
      '</div>' + (isNew ? '<div class="note">' + T('كلمة المرور: 8 أحرف على الأقل وتحتوي على حروف وأرقام. سيُطلب من المستخدم تغييرها عند أول دخول.', 'Password: at least 8 characters with letters and digits. The user must change it at first sign-in.') + '</div>' : '') +
      '<h3 style="font-size:14px;margin:14px 0 6px">' + T('صلاحيات المستخدم', 'User permissions') + '</h3><div id="permBox">' + permTable(u.PERMS, false, u.ROLE === 'SuperAdmin') + '</div>',
      '<button class="btn pri" onclick="FA.saveUser(' + (isNew ? 1 : 0) + ')">' + icon('save') + T('حفظ', 'Save') + '</button><button class="btn" onclick="FA.closeModal()">' + T('إلغاء', 'Cancel') + '</button>', { wide: true });
  }

  function roleChanged(r) { $('#permBox').innerHTML = permTable(roleTemplate(r), false, r === 'SuperAdmin'); }

  async function saveUser(isNew) {
    var perms = {};
    $$('#permBox input[type=checkbox]').forEach(function (c) {
      var pg = c.getAttribute('data-pg');
      perms[pg] = perms[pg] || {};
      perms[pg][c.getAttribute('data-a')] = c.checked;
    });
    var data = { USERNAME: $('#u_name').value, FULLNAME: $('#u_full').value, EMAIL: $('#u_email').value, ROLE: $('#u_role').value, PERMS: perms };
    if (isNew) data.PASSWORD = $('#u_pw').value;
    try {
      await api('saveUser', S.token, data, !!isNew);
      closeModal();
      toast(T('تم الحفظ', 'Saved'), 'ok');
      render();
    } catch (e) { fail(e); }
  }

  async function userStatus(i) {
    var u = S.users[i];
    var to = u.STATUS === 'Active' ? 'Inactive' : 'Active';
    if (!(await confirmBox(to === 'Active' ? T('تفعيل المستخدم ', 'Activate user ') + u.USERNAME + '?' : T('إيقاف المستخدم ', 'Deactivate user ') + u.USERNAME + T('؟ سيتم إنهاء جلساته.', '? Their sessions will end.')))) return;
    try { await api('setUserStatus', S.token, u.USERNAME, to); toast(T('تم', 'Done'), 'ok'); render(); } catch (e) { fail(e); }
  }

  async function userDelete(i) {
    var u = S.users[i];
    if (!(await confirmBox(T('حذف المستخدم ', 'Delete user ') + u.USERNAME + '?', T('حذف', 'Delete'), true))) return;
    try { await api('deleteUser', S.token, u.USERNAME); toast(T('تم الحذف', 'Deleted'), 'ok'); render(); } catch (e) { fail(e); }
  }

  function resetPwDlg(i) {
    var u = S.users[i];
    S.editUser = u;
    modal(T('إعادة تعيين كلمة المرور — ', 'Reset password — ') + u.USERNAME,
      '<div class="fld"><label>' + T('كلمة المرور الجديدة', 'New password') + '</label><input class="inp" id="rp1" type="password" dir="ltr" autocomplete="new-password"></div>' +
      '<div class="fld"><label>' + T('تأكيد كلمة المرور', 'Confirm password') + '</label><input class="inp" id="rp2" type="password" dir="ltr" autocomplete="new-password"></div>' +
      '<div class="note">' + T('سيُطلب من المستخدم تغييرها عند الدخول التالي، وستنتهي جلساته الحالية.', 'The user must change it at next sign-in; current sessions will end.') + '</div>',
      '<button class="btn pri" onclick="FA.resetPw()">' + T('حفظ', 'Save') + '</button><button class="btn" onclick="FA.closeModal()">' + T('إلغاء', 'Cancel') + '</button>');
  }
  async function resetPw() {
    if ($('#rp1').value !== $('#rp2').value) return toast(T('كلمتا المرور غير متطابقتين', 'Passwords do not match'), 'err');
    try { await api('resetUserPassword', S.token, S.editUser.USERNAME, $('#rp1').value); closeModal(); toast(T('تم تغيير كلمة المرور', 'Password changed'), 'ok'); } catch (e) { fail(e); }
  }

  function changePasswordDlg(forced) {
    $('#userMenu').classList.add('hidden');
    modal(T('تغيير كلمة المرور', 'Change password'),
      (forced ? '<div class="note">' + T('يجب تغيير كلمة المرور قبل المتابعة.', 'You must change your password before continuing.') + '</div>' : '') +
      '<div class="fld"><label>' + T('كلمة المرور الحالية', 'Current password') + '</label><input class="inp" id="cp0" type="password" dir="ltr" autocomplete="current-password"></div>' +
      '<div class="fld"><label>' + T('كلمة المرور الجديدة', 'New password') + '</label><input class="inp" id="cp1" type="password" dir="ltr" autocomplete="new-password"></div>' +
      '<div class="fld"><label>' + T('تأكيد كلمة المرور', 'Confirm password') + '</label><input class="inp" id="cp2" type="password" dir="ltr" autocomplete="new-password"></div>',
      '<button class="btn pri" onclick="FA.changePw(' + (forced ? 1 : 0) + ')">' + T('حفظ', 'Save') + '</button>' +
      (forced ? '<button class="btn" onclick="FA.logout()">' + T('تسجيل الخروج', 'Sign out') + '</button>' : '<button class="btn" onclick="FA.closeModal()">' + T('إلغاء', 'Cancel') + '</button>'),
      { locked: forced });
  }
  async function changePw() {
    if ($('#cp1').value !== $('#cp2').value) return toast(T('كلمتا المرور غير متطابقتين', 'Passwords do not match'), 'err');
    try {
      await api('changePassword', S.token, $('#cp0').value, $('#cp1').value);
      S.b.user.mustChange = false;
      closeModal();
      toast(T('تم تغيير كلمة المرور', 'Password changed'), 'ok');
    } catch (e) { fail(e); }
  }

  /* ======================= Settings ======================= */
  async function pageSettings() {
    crumbs([S.b.settings.ORGNAME, T('الإعدادات', 'Settings')]);
    var tab = S.view.tab || 'general';
    var tabs = [['general', 'عام', 'General'], ['sessions', 'الجلسات', 'Sessions']];
    if (can('masterdata')) tabs.push(['lookups', 'أسماء اليوميات', 'Journal names']);
    var head = apane([]) .replace('<div class="bar"></div>', '<div class="bar">' + tabs.map(function (t) {
      return '<button class="abtn tab ' + (t[0] === tab ? 'on' : '') + '" onclick="FA.go(\'settings\',{tab:\'' + t[0] + '\'})">' + esc(T(t[1], t[2])) + '</button>';
    }).join('') + '</div>');
    var body = tab === 'sessions' ? await settingsSessions() : tab === 'lookups' ? await lookupsPanel(['JournalName']) : settingsGeneral();
    $('#main').innerHTML = head + phead(T('الإدارة', 'Administration'), T('الإعدادات', 'Settings')) + '<div class="content">' + body + '</div>';
    if (tab === 'lookups') gridRender('lk');
  }

  function settingsGeneral() {
    var st = S.b.settings, ro = !can('settings', 'edit');
    var curs = ['DJF', 'USD', 'EUR', 'SAR', 'AED', 'EGP', 'KWD', 'QAR', 'BHD', 'OMR', 'JOD', 'GBP', 'ETB'];
    return '<div class="card ftab"><div class="ftab-h"><h3>' + T('بيانات المؤسسة', 'Organization') + '</h3></div><div class="ftab-b">' +
      '<div class="fgroup"><h5>' + T('الشعار', 'Logo') + '</h5><div class="logo-prev">' + (st.LOGO ? '<img src="' + esc(st.LOGO) + '" alt="">' : icon('image')) + '</div>' +
      (ro ? '' : '<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" onchange="FA.logoPicked(this)">' +
        '<button class="btn" onclick="document.getElementById(\'logoFile\').click()">' + icon('upload') + T('رفع شعار', 'Upload logo') + '</button> ' +
        (st.LOGO ? '<button class="btn" onclick="FA.removeLogo()">' + T('إزالة', 'Remove') + '</button>' : '')) + '</div>' +
      '<div class="fgroup"><h5>' + T('البيانات العامة', 'General') + '</h5>' +
      sf('ORGNAME', T('اسم المؤسسة', 'Organization name'), st.ORGNAME, ro) +
      sf('ORGEMAIL', T('البريد الإلكتروني', 'Email'), st.ORGEMAIL, ro, 'email') +
      '<div class="fld"><label>' + T('العملة', 'Currency') + '</label><input class="inp" data-s="CURRENCY" list="curList" dir="ltr" maxlength="3" value="' + esc(st.CURRENCY) + '" ' + (ro ? 'readonly' : '') + '>' +
      '<datalist id="curList">' + curs.map(function (c) { return '<option value="' + c + '">'; }).join('') + '</datalist></div></div>' +
      '<div class="fgroup"><h5>' + T('الاستيراد واليوميات', 'Import & journals') + '</h5>' +
      '<div class="fld"><label>' + T('صيغة التاريخ في ملفات CSV المستوردة', 'Date format in imported CSV files') + '</label><select class="inp" data-s="DATEFORMAT" ' + (ro ? 'disabled' : '') + '>' +
      '<option value="MDY" ' + (st.DATEFORMAT === 'MDY' ? 'selected' : '') + '>MM/DD/YYYY (D365 en-us)</option><option value="DMY" ' + (st.DATEFORMAT === 'DMY' ? 'selected' : '') + '>DD/MM/YYYY</option></select></div>' +
      sf('JOURNALPREFIX', T('بادئة رقم اليومية', 'Journal number prefix'), st.JOURNALPREFIX, ro) + '</div>' +
      '<div class="fgroup"><h5>' + T('الإهلاك', 'Depreciation') + '</h5>' +
      sf('DEPMONTHS', T('دورة الإهلاك (شهور)', 'Depreciation cycle (months)'), st.DEPMONTHS, ro) +
      sf('DEPJOURNALNAME', T('اسم يومية الإهلاك الافتراضي', 'Default depreciation journal name'), st.DEPJOURNALNAME, ro) +
      '<div class="fld"><label>' + T('حساب مصروف الإهلاك الافتراضي', 'Default depreciation expense account') + '</label><input class="inp" data-s="DEPOFFSETACCOUNT" list="dl_setacc" dir="ltr" value="' + esc(st.DEPOFFSETACCOUNT) + '" ' + (ro ? 'readonly' : '') + '>' +
      '<datalist id="dl_setacc">' + datalistOpts('@accounts', null, {}) + '</datalist></div></div>' +
      '</div>' + (ro ? '' : '<div style="padding:0 14px 14px"><button class="btn pri" onclick="FA.saveSettings()">' + icon('save') + T('حفظ الإعدادات', 'Save settings') + '</button></div>') + '</div>';
  }
  function sf(k, label, v, ro, type) {
    return '<div class="fld"><label>' + esc(label) + '</label><input class="inp" data-s="' + k + '" ' + (type === 'email' ? 'type="email" dir="ltr"' : '') + ' value="' + esc(v) + '" ' + (ro ? 'readonly' : '') + '></div>';
  }

  async function saveSettings() {
    var d = {};
    $$('[data-s]').forEach(function (el) { d[el.getAttribute('data-s')] = el.value; });
    try {
      S.b.settings = await api('saveSettings', S.token, d);
      chrome();
      toast(T('تم حفظ الإعدادات', 'Settings saved'), 'ok');
      render();
    } catch (e) { fail(e); }
  }

  function logoPicked(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = async function () {
        var scale = Math.min(1, 240 / img.width, 120 / img.height);
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var url = c.toDataURL('image/png');
        if (url.length > 45000) url = c.toDataURL('image/jpeg', 0.85);
        try {
          await api('saveLogo', S.token, url);
          S.b.settings.LOGO = url;
          chrome();
          toast(T('تم تحديث الشعار', 'Logo updated'), 'ok');
          render();
        } catch (e) { fail(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  async function removeLogo() {
    try { await api('saveLogo', S.token, ''); S.b.settings.LOGO = ''; chrome(); render(); } catch (e) { fail(e); }
  }

  async function settingsSessions() {
    var st = S.b.settings, ro = !can('settings', 'edit');
    var list = await api('listSessions', S.token);
    return '<div class="card ftab"><div class="ftab-h"><h3>' + T('سياسة الجلسات', 'Session policy') + '</h3></div><div class="ftab-b">' +
      '<div class="fgroup">' + sf('SESSIONTIMEOUT', T('مدة انتهاء الجلسة عند عدم النشاط (دقائق)', 'Idle session timeout (minutes)'), st.SESSIONTIMEOUT, ro) +
      sf('MAXSESSIONS', T('أقصى عدد جلسات متزامنة لكل مستخدم', 'Max concurrent sessions per user'), st.MAXSESSIONS, ro) + '</div></div>' +
      (ro ? '' : '<div style="padding:0 14px 14px"><button class="btn pri" onclick="FA.saveSettings()">' + icon('save') + T('حفظ', 'Save') + '</button></div>') + '</div>' +
      '<div class="card"><div class="ftab-h"><h3>' + T('الجلسات النشطة', 'Active sessions') + ' (' + list.length + ')</h3></div><div class="gridwrap"><table class="grid"><thead><tr><th>' +
      T('المستخدم', 'User') + '</th><th>' + T('بدأت', 'Started') + '</th><th>' + T('آخر نشاط', 'Last activity') + '</th><th></th></tr></thead><tbody>' +
      list.map(function (x) {
        return '<tr><td>' + esc(x.fullName) + ' <code class="tag">' + esc(x.username) + '</code>' + (x.current ? ' <span class="badge b-info">' + T('جلستك الحالية', 'This session') + '</span>' : '') + '</td><td>' +
          esc(new Date(x.created).toLocaleString()) + '</td><td>' + esc(new Date(x.lastSeen).toLocaleString()) + '</td><td>' +
          (!x.current && !ro ? '<button class="btn" onclick="FA.endSession(\'' + esc(x.id) + '\')">' + icon('logout') + T('إنهاء', 'End') + '</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  async function endSession(id) {
    if (!(await confirmBox(T('إنهاء هذه الجلسة؟', 'End this session?')))) return;
    try { await api('endSessionById', S.token, id); toast(T('تم إنهاء الجلسة', 'Session ended'), 'ok'); render(); } catch (e) { fail(e); }
  }

  /* ======================= Boot ======================= */
  async function start() {
    S.lang = ls('fa_lang') || 'ar';
    applyLang();
    $('#loginForm').addEventListener('submit', doLogin);
    $('#loginLang').addEventListener('click', function () { setLang(S.lang === 'ar' ? 'en' : 'ar'); });
    $('#langBtn').addEventListener('click', function () { setLang(S.lang === 'ar' ? 'en' : 'ar'); });
    $('#navToggle').addEventListener('click', function () { $('#navpane').classList.toggle('collapsed'); });
    $('#userBtn').addEventListener('click', function (ev) { ev.stopPropagation(); $('#userMenu').classList.toggle('hidden'); });
    document.addEventListener('click', function (ev) { if (!ev.target.closest('#userMenu')) $('#userMenu').classList.add('hidden'); });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && $('#modal .overlay') && !S.b?.user?.mustChange) closeModal(); });
    $('#fileInput').addEventListener('change', function () { if (this.files[0]) onImportFile(this.files[0]); });
    try { S.info = await api('getPublicInfo'); } catch (e) { S.info = {}; }
    var tok = ls('fa_token');
    if (tok) {
      try { enter(await api('bootstrap', tok)); return; } catch (e) { lsSet('fa_token', ''); }
    }
    showLogin();
  }

  window.FA = {
    go: go, render: render, closeModal: closeModal, toggleTab: toggleTab, fchg: fchg,
    lkName: function (el) { updateLkName(el); },
    gq: gq, gsort: gsort, gsel: gsel, gselAll: gselAll, gopen: gopen,
    saveRecord: saveRecordBtn, deleteCurrent: deleteCurrent, deleteSelected: deleteSelected, reload: reload,
    exportGrid: exportGrid, exportTemplate: exportTemplate, importStart: importStart, importRun: importRun,
    booksFilter: booksFilter, openBook: openBook, saveBook: saveBook, deleteBook: deleteBook, exportBooks: exportBooks, newBookFor: newBookFor,
    newJournal: newJournal, newJournalGo: newJournalGo, lineDlg: lineDlg, saveLine: saveLine, deleteLine: deleteLine, deleteLines: deleteLines,
    deleteBatches: deleteBatches, jAction: jAction, exportRowsBatch: exportRowsBatch, exportAllJournal: exportAllJournal, assetTrans: assetTrans,
    userDlg: userDlg, userExpand: userExpand, roleChanged: roleChanged, saveUser: saveUser, userStatus: userStatus, userDelete: userDelete,
    resetPwDlg: resetPwDlg, resetPw: resetPw, changePasswordDlg: changePasswordDlg, changePw: changePw, logout: logout,
    saveSettings: saveSettings, logoPicked: logoPicked, removeLogo: removeLogo, endSession: endSession,
    lookupDlg: lookupDlg, saveLookup: saveLookup, ltab: ltab, tip: tip,
    accSearch: accSearch, accToggle: accToggle, accAll: accAll, exportRowsAcc: exportRowsAcc,
    depCalc: depCalc, depCreate: depCreate, depExport: depExport, repFilter: repFilter, repRefresh: repRefresh, repExport: repExport
  };

  start();
})();
</script>
