  /* ======================= Searchable dropdowns (all lists) ======================= */
  var CB = { el: null, panel: null, search: null, items: [], shown: [], idx: -1 };

  /** تطبيع للبحث العربي: تجاهل التشكيل والهمزات والتاء المربوطة والألف المقصورة. */
  function normAr(s) {
    return String(s || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
  }

  function enhanceCombos(root) {
    $$('input[list]', root).forEach(function (el) {
      el.setAttribute('data-dl', el.getAttribute('list'));
      el.removeAttribute('list');
      el.classList.add('combo');
      el.setAttribute('autocomplete', 'off');
    });
  }

  function comboItems(el) {
    if (el.tagName === 'SELECT') {
      return Array.prototype.map.call(el.options, function (o) { return { v: o.value, c: '', n: o.textContent || (o.value ? o.value : '—') }; });
    }
    var dl = document.getElementById(el.getAttribute('data-dl'));
    return dl ? Array.prototype.map.call(dl.options, function (o) { return { v: o.value, c: o.value, n: o.textContent || o.label || '' }; }) : [];
  }

  function comboOpen(el) {
    comboClose();
    CB.el = el;
    CB.items = comboItems(el);
    var isSel = el.tagName === 'SELECT';
    var p = document.createElement('div');
    p.className = 'cb-panel';
    p.setAttribute('dir', document.documentElement.dir);
    p.innerHTML = (isSel || CB.items.length > 8 ? '<div class="cb-search">' + icon('search') + '<input placeholder="' + T('بحث...', 'Search...') + '"></div>' : '') + '<div class="cb-list" role="listbox"></div>';
    document.body.appendChild(p);
    CB.panel = p;
    CB.search = isSel || CB.items.length > 8 ? p.querySelector('.cb-search input') : null;
    if (CB.search && !isSel) CB.search.parentNode.style.display = 'none'; // في الحقول النصية الكتابة في الحقل نفسه
    if (CB.search && isSel) {
      CB.search.addEventListener('input', function () { comboFilter(CB.search.value); });
      setTimeout(function () { if (CB.search) CB.search.focus(); }, 0);
    }
    p.addEventListener('mousedown', function (ev) {
      var it = ev.target.closest('.cb-it');
      if (it) { ev.preventDefault(); comboChoose(Number(it.getAttribute('data-i'))); }
      else if (ev.target.tagName !== 'INPUT') ev.preventDefault();
    });
    comboFilter(isSel ? '' : '', true);
    comboPlace();
  }

  function comboPlace() {
    if (!CB.el || !CB.panel) return;
    var r = CB.el.getBoundingClientRect();
    var w = Math.min(Math.max(r.width, 280), window.innerWidth - 16);
    var below = window.innerHeight - r.bottom;
    var h = Math.min(320, CB.panel.scrollHeight || 320);
    CB.panel.style.width = w + 'px';
    CB.panel.style.top = (below < h + 8 && r.top > below ? Math.max(8, r.top - h - 2) : r.bottom + 2) + 'px';
    var left = document.documentElement.dir === 'rtl' ? r.right - w : r.left;
    CB.panel.style.left = Math.max(8, Math.min(left, window.innerWidth - w - 8)) + 'px';
  }

  function hl(text, q) {
    if (!q) return esc(text);
    var t = String(text), n = normAr(t), i = n.indexOf(q);
    if (i < 0 || n.length !== t.toLowerCase().length) return esc(t);
    return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
  }

  function comboFilter(q, initial) {
    if (!CB.panel) return;
    var nq = normAr(q);
    var cur = CB.el.value;
    // عند الفتح يُعرض كل شيء مع تمييز القيمة الحالية
    var list = CB.items.map(function (x, i) { return { x: x, i: i }; }).filter(function (o) {
      return initial || !nq || normAr(o.x.c).indexOf(nq) >= 0 || normAr(o.x.n).indexOf(nq) >= 0;
    });
    if (nq && !initial) {
      list.sort(function (a, b) {
        var as = normAr(a.x.c).indexOf(nq) === 0 || normAr(a.x.n).indexOf(nq) === 0 ? 0 : 1;
        var bs = normAr(b.x.c).indexOf(nq) === 0 || normAr(b.x.n).indexOf(nq) === 0 ? 0 : 1;
        return as - bs;
      });
    }
    CB.shown = list.slice(0, 300);
    CB.idx = -1;
    CB.shown.forEach(function (o, k) { if (cur !== '' && low(o.x.v) === low(cur) && CB.idx < 0) CB.idx = k; });
    var box = CB.panel.querySelector('.cb-list');
    var hq = initial ? '' : nq;
    box.innerHTML = CB.shown.length ? CB.shown.map(function (o, k) {
      var x = o.x;
      return '<div class="cb-it' + (k === CB.idx ? ' on' : '') + (low(x.v) === low(cur) && cur !== '' ? ' cur' : '') + '" data-i="' + o.i + '" role="option">' +
        (x.c ? '<b dir="ltr">' + hl(x.c, hq) + '</b>' : '') + '<span>' + (x.n ? hl(x.n, hq) : (x.c ? '' : '<i>' + T('— فارغ —', '— none —') + '</i>')) + '</span></div>';
    }).join('') + (list.length > CB.shown.length ? '<div class="cb-more">' + T('اكتب للبحث في ', 'Type to search ') + list.length + T(' عنصراً', ' items') + '</div>' : '')
      : '<div class="cb-empty">' + T('لا توجد نتائج', 'No results') + '</div>';
    var on = box.querySelector('.cb-it.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
    comboPlace();
  }

  function comboMove(d) {
    if (!CB.shown.length) return;
    CB.idx = (CB.idx + d + CB.shown.length) % CB.shown.length;
    $$('.cb-it', CB.panel).forEach(function (n, k) { n.classList.toggle('on', k === CB.idx); });
    var on = CB.panel.querySelector('.cb-it.on');
    if (on) on.scrollIntoView({ block: 'nearest' });
  }

  function comboChoose(i) {
    var el = CB.el, x = CB.items[i];
    if (!el || !x) return;
    comboClose();
    el.value = x.v;
    if (el.tagName !== 'SELECT') el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
    el.focus();
    CB.justChose = el;
    setTimeout(function () { CB.justChose = null; }, 50);
  }

  function comboClose() {
    if (CB.panel) CB.panel.remove();
    CB.panel = null; CB.el = null; CB.search = null; CB.shown = []; CB.idx = -1;
  }

  function initCombos() {
    enhanceCombos(document);
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        Array.prototype.forEach.call(m.addedNodes, function (n) { if (n.nodeType === 1 && n !== CB.panel) enhanceCombos(n.matches && n.matches('input[list]') ? n.parentNode : n); });
      });
    }).observe(document.body, { childList: true, subtree: true });

    document.addEventListener('focusin', function (e) {
      var el = e.target;
      if (CB.panel && (el === CB.el || CB.panel.contains(el))) return;
      // لا تُفتح القائمة عند التركيز التلقائي — فقط بالنقر أو الكتابة أو السهم ↓
      if (CB.panel) comboClose();
    });
    document.addEventListener('mousedown', function (e) {
      if (CB.panel && CB.panel.contains(e.target)) return;
      var sel = e.target.closest && e.target.closest('select.inp');
      if (sel && !sel.disabled && !sel.multiple) {
        e.preventDefault();
        if (CB.el === sel) { comboClose(); return; }
        sel.focus();
        comboOpen(sel);
        return;
      }
      var inp = e.target.closest && e.target.closest('input.combo');
      if (inp && inp === CB.el) return;
      if (inp && !inp.readOnly && !inp.disabled) { comboOpen(inp); return; }
      if (CB.panel) comboClose();
    }, true);
    document.addEventListener('input', function (e) {
      var el = e.target;
      if (CB.el && el === CB.el && el.tagName !== 'SELECT') { comboFilter(el.value); return; }
      if (!CB.panel && el.classList && el.classList.contains('combo') && !el.readOnly && !el.disabled && e.isTrusted) { comboOpen(el); comboFilter(el.value); }
    });
    document.addEventListener('change', function (e) { if (CB.el && e.target === CB.el) comboClose(); });
    document.addEventListener('keydown', function (e) {
      if (!CB.panel) {
        if (e.key === 'ArrowDown' && e.target.classList && e.target.classList.contains('combo')) { comboOpen(e.target); e.preventDefault(); }
        return;
      }
      if (e.target !== CB.el && e.target !== CB.search) return;
      if (e.key === 'ArrowDown') { comboMove(1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { comboMove(-1); e.preventDefault(); }
      else if (e.key === 'Enter') {
        if (CB.idx >= 0) { e.preventDefault(); comboChoose(CB.shown[CB.idx].i); }
        else if (CB.shown.length === 1) { e.preventDefault(); comboChoose(CB.shown[0].i); }
        else comboClose();
      } else if (e.key === 'Escape') { comboClose(); e.stopPropagation(); }
      else if (e.key === 'Tab') comboClose();
    }, true);
    window.addEventListener('resize', comboClose);
    document.addEventListener('scroll', function (e) { if (CB.panel && !CB.panel.contains(e.target)) comboPlace(); }, true);
  }

  /* ======================= Financial reports ======================= */
  var FIN_TABS = [
    ['tb', 'ميزان المراجعة', 'Trial balance'], ['ledger', 'دفتر الأستاذ', 'General ledger'],
    ['bs', 'الميزانية العمومية', 'Balance sheet'], ['is', 'قائمة الدخل', 'Income statement'], ['cf', 'التدفقات النقدية', 'Cash flow statement']
  ];
  // مؤشرات أعمدة سطور القيود القادمة من الخادم
  var LD = { date: 0, voucher: 1, journal: 2, desc: 3, acc: 4, ou: 5, s1: 6, s2: 7, dr: 8, cr: 9, note: 10, ref: 11, src: 12, line: 13 };

  function fmtAcc(n, dec) {
    n = Math.round((Number(n) || 0) * 1000) / 1000;
    if (!n) return '-';
    return n < 0 ? '(' + fmtNum(-n, dec === undefined ? 2 : dec) + ')' : fmtNum(n, dec === undefined ? 2 : dec);
  }

  function finDefaults() {
    var d = new Date();
    return { from: d.getFullYear() + '-01-01', to: today(), unit: '', account: '', zero: false, headersOnly: false };
  }

  function finAcc() {
    var m = {};
    S.fin.accounts.forEach(function (a) { m[low(a.c)] = a; });
    return m;
  }

  function unitMatch(l, u) {
    if (!u) return true;
    var p = u.split(':'), k = p[0], v = low(p.slice(1).join(':'));
    return low(l[k === 'OU' ? LD.ou : k === 'S1' ? LD.s1 : LD.s2]) === v;
  }

  function finLines(to, from) {
    var f = S.finF;
    return S.fin.lines.filter(function (l) {
      return unitMatch(l, f.unit) && (!to || l[LD.date] <= to) && (!from || l[LD.date] >= from);
    });
  }

  /** أرصدة الحسابات: {code: {dr, cr}} */
  function sumBy(lines) {
    var m = {};
    lines.forEach(function (l) {
      var k = low(l[LD.acc]);
      var x = m[k] = m[k] || { dr: 0, cr: 0 };
      x.dr += l[LD.dr]; x.cr += l[LD.cr];
    });
    return m;
  }

  function dayBefore(d) {
    var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - 1);
    return t.toISOString().slice(0, 10);
  }

  /** نوع الحساب لأغراض القوائم: أصول/خصوم/حقوق ملكية/إيرادات/مصروفات/أخرى. */
  function accClass(a, bal) {
    var t = a ? a.t : '';
    if (t === 'Asset') return 'A';
    if (t === 'Liability') return 'L';
    if (t === 'Equity') return 'E';
    if (t === 'Revenue') return 'R';
    if (t === 'Expense') return 'X';
    if (t === 'ProfitAndLoss') return 'P';
    if (t === 'BalanceSheet') return bal >= 0 ? 'A' : 'L';
    return '';
  }
  function isPL(cls) { return cls === 'R' || cls === 'X' || cls === 'P'; }

  /** تصنيف التدفق النقدي للحساب (المحدد في الدليل أو الافتراضي). */
  function cfClass(a, am) {
    if (!a) return 'Operating';
    if (a.cf) return a.cf;
    if (String(a.cat).toUpperCase() === 'CASH') return 'Cash';
    if (S.fin.faAccounts.indexOf(low(a.c)) >= 0) return 'Investing';
    var parent = am[low(a.p)];
    if (parent && String(parent.cat).toUpperCase() === 'FA' && a.t === 'Asset' && !/مجمع/.test(a.n)) return 'Investing';
    if (a.t === 'Equity') return 'Financing';
    return 'Operating';
  }

  /* ---------- statement rows → HTML / Excel ---------- */
  // row: { k: 'sec'|'grp'|'acc'|'sub'|'tot'|'grand'|'note', label, code, v: [numbers], link, indent }
  function stmtHtml(heads, rows) {
    return '<table class="stmt"><thead><tr>' + heads.map(function (h, i) { return '<th class="' + (i > 1 ? 'n' : '') + '">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        if (r.k === 'sec') return '<tr class="r-sec"><td colspan="' + heads.length + '">' + esc(r.label) + '</td></tr>';
        if (r.k === 'note') return '<tr class="r-note"><td colspan="' + heads.length + '">' + r.label + '</td></tr>';
        var code = r.code ? (r.link ? '<a onclick="FA.finLedger(' + jsArg(r.code) + ')"><bdi>' + esc(r.code) + '</bdi></a>' : '<bdi>' + esc(r.code) + '</bdi>') : '';
        return '<tr class="r-' + r.k + '"><td>' + code + '</td><td style="padding-inline-start:' + (8 + (r.indent || 0) * 18) + 'px">' + esc(r.label) + '</td>' +
          (r.v || []).map(function (x) { return typeof x === 'string' ? '<td>' + esc(x) + '</td>' : '<td class="n">' + fmtAcc(x) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }

  function stmtAoa(heads, rows) {
    return [heads].concat(rows.map(function (r) {
      if (r.k === 'sec' || r.k === 'note') return [String(r.label).replace(/<[^>]+>/g, '')];
      return [r.code || '', r.label].concat((r.v || []).map(function (x) { return typeof x === 'string' ? x : Math.round(x * 1000) / 1000; }));
    }));
  }

  /* ---------- Trial balance ---------- */
  function buildTB() {
    var f = S.finF, am = finAcc();
    var noYE = function (l) { return !f.noClosing || l[LD.src] !== 'YearEnd'; };
    var open = sumBy(finLines(dayBefore(f.from))), per = sumBy(finLines(f.to, f.from).filter(noYE));
    var codes = {};
    Object.keys(open).concat(Object.keys(per)).forEach(function (k) { codes[k] = 1; });
    S.fin.accounts.forEach(function (a) { if (!a.h) codes[low(a.c)] = 1; });
    var rowOf = function (k) {
      var o = open[k] || { dr: 0, cr: 0 }, p = per[k] || { dr: 0, cr: 0 };
      var ob = o.dr - o.cr, cb = ob + p.dr - p.cr;
      return { ob: ob, pd: p.dr, pc: p.cr, cb: cb };
    };
    var vals = function (x) { return [x.ob > 0 ? x.ob : 0, x.ob < 0 ? -x.ob : 0, x.pd, x.pc, x.cb > 0 ? x.cb : 0, x.cb < 0 ? -x.cb : 0]; };
    var groups = {}, order = [];
    Object.keys(codes).forEach(function (k) {
      var a = am[k] || { c: k, n: T('حساب غير موجود في الدليل', 'Account not in chart'), p: '' };
      var x = rowOf(k);
      if (!f.zero && !x.ob && !x.pd && !x.pc && !x.cb) return;
      var g = low(a.p) && am[low(a.p)] ? low(a.p) : '_';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push({ a: a, x: x });
    });
    order.sort(function (a, b) { return a === '_' ? 1 : b === '_' ? -1 : a.localeCompare(b, undefined, { numeric: true }); });
    var rows = [], tot = { ob: 0, pd: 0, pc: 0, cb: 0 }, totV = [0, 0, 0, 0, 0, 0];
    order.forEach(function (g) {
      var h = am[g];
      var items = groups[g].sort(function (a, b) { return String(a.a.c).localeCompare(String(b.a.c), undefined, { numeric: true }); });
      var gs = [0, 0, 0, 0, 0, 0];
      items.forEach(function (it) { vals(it.x).forEach(function (v, i) { gs[i] += v; }); });
      if (!f.headersOnly) {
        rows.push({ k: 'grp', code: h ? h.c : '', label: h ? h.n : T('حسابات بدون حساب رئيسي', 'Accounts without header') });
        items.forEach(function (it) { rows.push({ k: 'acc', code: it.a.c, label: it.a.n, v: vals(it.x), link: 1, indent: 1 }); });
        rows.push({ k: 'sub', label: T('إجمالي ', 'Total ') + (h ? h.n : ''), v: gs });
      } else {
        rows.push({ k: 'acc', code: h ? h.c : '', label: h ? h.n : T('حسابات بدون حساب رئيسي', 'Accounts without header'), v: gs });
      }
      gs.forEach(function (v, i) { totV[i] += v; });
    });
    rows.push({ k: 'grand', label: T('الإجمالي', 'Total'), v: totV });
    var ok = Math.abs(totV[0] - totV[1]) < 0.01 && Math.abs(totV[2] - totV[3]) < 0.01 && Math.abs(totV[4] - totV[5]) < 0.01;
    rows.push({ k: 'note', label: ok ? '<span class="badge b-ok">' + T('الميزان متوازن', 'Trial balance is balanced') + '</span>' : '<span class="badge b-err">' + T('الميزان غير متوازن!', 'Trial balance is NOT balanced!') + '</span>' });
    return {
      heads: [T('رقم الحساب', 'Account'), T('اسم الحساب', 'Name'), T('افتتاحي مدين', 'Opening Dr'), T('افتتاحي دائن', 'Opening Cr'), T('حركة مدين', 'Period Dr'),
        T('حركة دائن', 'Period Cr'), T('ختامي مدين', 'Closing Dr'), T('ختامي دائن', 'Closing Cr')], rows: rows
    };
  }

  /* ---------- General ledger ---------- */
  function buildLedger() {
    var f = S.finF, am = finAcc();
    var target = low(f.account);
    var accs;
    if (target) {
      var a = am[target];
      accs = a && a.h ? S.fin.accounts.filter(function (x) { return low(x.p) === target && !x.h; }).map(function (x) { return low(x.c); }) : [target];
    } else {
      var used = {};
      finLines(f.to).forEach(function (l) { used[low(l[LD.acc])] = 1; });
      accs = Object.keys(used);
    }
    accs.sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
    var rows = [];
    accs.forEach(function (k) {
      var a = am[k] || { c: k, n: '' };
      var all = finLines(f.to).filter(function (l) { return low(l[LD.acc]) === k; });
      var ob = 0;
      all.forEach(function (l) { if (l[LD.date] < f.from) ob += l[LD.dr] - l[LD.cr]; });
      var mv = all.filter(function (l) { return l[LD.date] >= f.from; })
        .sort(function (x, y) { return x[LD.date].localeCompare(y[LD.date]) || x[LD.voucher].localeCompare(y[LD.voucher], undefined, { numeric: true }) || x[LD.line] - y[LD.line]; });
      if (!ob && !mv.length) return;
      rows.push({ k: 'sec', label: a.c + ' — ' + a.n });
      var bal = ob, td = 0, tc = 0;
      rows.push({ k: 'sub', label: T('رصيد أول المدة', 'Opening balance'), v: ['', '', '', '', '', bal] });
      mv.forEach(function (l) {
        bal += l[LD.dr] - l[LD.cr]; td += l[LD.dr]; tc += l[LD.cr];
        var fxTxt = l[14] && String(l[14]).toUpperCase() !== localCur() ? ' [' + l[14] + ' ' + fmtNum(l[15] || l[16], 2) + ']' : '';
        rows.push({ k: 'acc', code: l[LD.voucher], label: (l[LD.desc] || '') + (l[LD.note] && l[LD.note] !== l[LD.desc] ? ' — ' + l[LD.note] : '') + fxTxt, vlink: l[LD.voucher],
          v: [l[LD.date], l[LD.journal], unitText(l[LD.ou], l[LD.s1], l[LD.s2]), l[LD.dr], l[LD.cr], bal] });
      });
      rows.push({ k: 'tot', label: T('الحركة والرصيد الختامي', 'Movement & closing balance'), v: ['', '', '', td, tc, bal] });
    });
    if (!rows.length) rows.push({ k: 'note', label: T('لا توجد حركات للفترة والحساب المحددين', 'No transactions for the selected period/account') });
    return { heads: [T('رقم القيد', 'Voucher'), T('البيان', 'Description'), T('التاريخ', 'Date'), T('اليومية', 'Journal'), T('الوحدة', 'Unit'), T('مدين', 'Debit'), T('دائن', 'Credit'), T('الرصيد (بين قوسين = دائن)', 'Balance (brackets = credit)')], rows: rows };
  }

  /* ---------- Income statement ---------- */
  function plSections(lines, am) {
    var b = sumBy(lines), sec = { R: [], X: [], P: [] };
    Object.keys(b).forEach(function (k) {
      var a = am[k], bal = b[k].dr - b[k].cr, c = accClass(a, bal);
      if (!isPL(c)) return;
      var amt = c === 'X' ? bal : -bal; // الإيرادات والأخرى بطبيعة دائنة، المصروفات مدينة
      if (Math.abs(amt) < 0.0005) return;
      sec[c].push({ a: a, amt: amt });
    });
    return sec;
  }

  function groupedRows(items, am, sign) {
    var rows = [], groups = {}, order = [], total = 0;
    items.forEach(function (it) {
      var g = it.a && low(it.a.p) && am[low(it.a.p)] ? low(it.a.p) : '_';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(it);
    });
    order.sort(function (a, b) { return a === '_' ? 1 : b === '_' ? -1 : a.localeCompare(b, undefined, { numeric: true }); });
    order.forEach(function (g) {
      var h = am[g], sub = 0;
      if (h) rows.push({ k: 'grp', code: h.c, label: h.n });
      groups[g].sort(function (a, b) { return String(a.a.c).localeCompare(String(b.a.c), undefined, { numeric: true }); }).forEach(function (it) {
        rows.push({ k: 'acc', code: it.a ? it.a.c : '', label: it.a ? it.a.n : '', v: [it.amt * (sign || 1)], link: 1, indent: h ? 1 : 0 });
        sub += it.amt;
      });
      if (h && groups[g].length > 1) rows.push({ k: 'sub', label: T('إجمالي ', 'Total ') + h.n, v: [sub * (sign || 1)] });
      total += sub;
    });
    return { rows: rows, total: total };
  }

  function buildIS() {
    var f = S.finF, am = finAcc();
    var sec = plSections(finLines(f.to, f.from).filter(function (l) { return l[LD.src] !== 'YearEnd'; }), am);
    var rows = [], r = groupedRows(sec.R, am), x = groupedRows(sec.X, am), p = groupedRows(sec.P, am);
    rows.push({ k: 'sec', label: T('الإيرادات', 'Revenue') });
    rows = rows.concat(r.rows);
    rows.push({ k: 'tot', label: T('إجمالي الإيرادات', 'Total revenue'), v: [r.total] });
    rows.push({ k: 'sec', label: T('المصروفات', 'Expenses') });
    rows = rows.concat(x.rows);
    rows.push({ k: 'tot', label: T('إجمالي المصروفات', 'Total expenses'), v: [x.total] });
    if (sec.P.length) {
      rows.push({ k: 'sec', label: T('أرباح وخسائر أخرى', 'Other gains and losses') });
      rows = rows.concat(p.rows);
      rows.push({ k: 'tot', label: T('صافي الأرباح والخسائر الأخرى', 'Net other gains/losses'), v: [p.total] });
    }
    var net = r.total - x.total + p.total;
    rows.push({ k: 'grand', label: net >= 0 ? T('صافي الربح', 'Net profit') : T('صافي الخسارة', 'Net loss'), v: [net] });
    return { heads: [T('رقم الحساب', 'Account'), T('البيان', 'Item'), T('المبلغ', 'Amount')], rows: rows, net: net };
  }

  /* ---------- Balance sheet ---------- */
  function buildBS() {
    var f = S.finF, am = finAcc();
    var lines = finLines(f.to);
    var b = sumBy(lines), items = { A: [], L: [], E: [] }, earnings = 0;
    Object.keys(b).forEach(function (k) {
      var a = am[k], bal = b[k].dr - b[k].cr, c = accClass(a, bal);
      if (isPL(c)) { earnings -= bal; return; }
      if (!c || Math.abs(bal) < 0.0005) return;
      items[c].push({ a: a, amt: c === 'A' ? bal : -bal });
    });
    var rows = [];
    var A = groupedRows(items.A, am), Lb = groupedRows(items.L, am), E = groupedRows(items.E, am);
    rows.push({ k: 'sec', label: T('الأصول', 'Assets') });
    rows = rows.concat(A.rows);
    rows.push({ k: 'grand', label: T('إجمالي الأصول', 'Total assets'), v: [A.total] });
    rows.push({ k: 'sec', label: T('الخصوم', 'Liabilities') });
    rows = rows.concat(Lb.rows);
    rows.push({ k: 'tot', label: T('إجمالي الخصوم', 'Total liabilities'), v: [Lb.total] });
    rows.push({ k: 'sec', label: T('حقوق الملكية', 'Equity') });
    rows = rows.concat(E.rows);
    rows.push({ k: 'acc', label: T('صافي ربح (خسارة) الفترات غير المُقفلة', 'Unclosed net profit (loss)'), v: [earnings], indent: 1 });
    rows.push({ k: 'tot', label: T('إجمالي حقوق الملكية', 'Total equity'), v: [E.total + earnings] });
    var le = Lb.total + E.total + earnings;
    rows.push({ k: 'grand', label: T('إجمالي الخصوم وحقوق الملكية', 'Total liabilities & equity'), v: [le] });
    var ok = Math.abs(A.total - le) < 0.01;
    rows.push({ k: 'note', label: ok ? '<span class="badge b-ok">' + T('الميزانية متوازنة', 'Balance sheet balances') + '</span>'
      : '<span class="badge b-err">' + T('الفرق: ', 'Difference: ') + fmtAcc(A.total - le) + ' — ' + T('راجع أنواع الحسابات في الدليل', 'check account types in the chart') + '</span>' });
    return { heads: [T('رقم الحساب', 'Account'), T('البيان', 'Item'), T('كما في ', 'As of ') + f.to], rows: rows };
  }

  /* ---------- Cash flow (direct method) ---------- */
  function buildCF() {
    var f = S.finF, am = finAcc();
    var isCash = function (code) { return cfClass(am[low(code)], am) === 'Cash'; };
    var cashBal = function (lines) { var s = 0; lines.forEach(function (l) { if (isCash(l[LD.acc])) s += l[LD.dr] - l[LD.cr]; }); return s; };
    var opening = cashBal(finLines(dayBefore(f.from))), closing = cashBal(finLines(f.to));
    var byV = {};
    finLines(f.to, f.from).forEach(function (l) { (byV[l[LD.voucher]] = byV[l[LD.voucher]] || []).push(l); });
    var cats = { Operating: {}, Investing: {}, Financing: {} };
    Object.keys(byV).forEach(function (v) {
      var ls = byV[v];
      var cash = 0, others = [], w = 0;
      ls.forEach(function (l) {
        if (isCash(l[LD.acc])) cash += l[LD.dr] - l[LD.cr];
        else { var x = l[LD.cr] - l[LD.dr]; others.push({ l: l, x: x }); w += x; }
      });
      if (Math.abs(cash) < 0.0005 || !others.length || Math.abs(w) < 0.0005) return;
      others.forEach(function (o) {
        var part = cash * o.x / w;
        var a = am[low(o.l[LD.acc])] || { c: o.l[LD.acc], n: o.l[LD.acc] };
        var c = cfClass(a, am);
        if (c === 'Cash') return;
        var m = cats[c] || cats.Operating;
        m[low(a.c)] = m[low(a.c)] || { a: a, amt: 0 };
        m[low(a.c)].amt += part;
      });
    });
    var rows = [], net = 0;
    [['Operating', 'التدفقات النقدية من الأنشطة التشغيلية', 'Cash flows from operating activities'],
      ['Investing', 'التدفقات النقدية من الأنشطة الاستثمارية', 'Cash flows from investing activities'],
      ['Financing', 'التدفقات النقدية من الأنشطة التمويلية', 'Cash flows from financing activities']].forEach(function (c) {
      rows.push({ k: 'sec', label: T(c[1], c[2]) });
      var list = Object.keys(cats[c[0]]).map(function (k) { return cats[c[0]][k]; }).filter(function (x) { return Math.abs(x.amt) >= 0.0005; })
        .sort(function (a, b) { return String(a.a.c).localeCompare(String(b.a.c), undefined, { numeric: true }); });
      var sub = 0;
      list.forEach(function (x) {
        rows.push({ k: 'acc', code: x.a.c, label: (x.amt >= 0 ? T('مقبوضات — ', 'Receipts — ') : T('مدفوعات — ', 'Payments — ')) + x.a.n, v: [x.amt], link: 1, indent: 1 });
        sub += x.amt;
      });
      if (!list.length) rows.push({ k: 'acc', label: T('لا توجد حركات', 'No movements'), v: [0], indent: 1 });
      rows.push({ k: 'tot', label: T('صافي ', 'Net ') + T(c[1], c[2]).replace(/^التدفقات النقدية /, 'التدفق النقدي '), v: [sub] });
      net += sub;
    });
    rows.push({ k: 'grand', label: T('صافي التغير في النقدية', 'Net change in cash'), v: [net] });
    rows.push({ k: 'acc', label: T('النقدية أول الفترة', 'Cash at beginning of period'), v: [opening] });
    rows.push({ k: 'grand', label: T('النقدية آخر الفترة', 'Cash at end of period'), v: [opening + net] });
    var ok = Math.abs(opening + net - closing) < 0.01;
    rows.push({ k: 'note', label: ok ? '<span class="badge b-ok">' + T('مطابق لرصيد حسابات النقدية', 'Matches cash account balances') + '</span>'
      : '<span class="badge b-warn">' + T('رصيد حسابات النقدية: ', 'Cash accounts balance: ') + fmtAcc(closing) + T(' — حدد تصنيف "نقدية" لحسابات البنوك والصندوق في دليل الحسابات', ' — tag bank/cash accounts as "Cash" in the chart of accounts') + '</span>' });
    return { heads: [T('رقم الحساب', 'Account'), T('البيان', 'Item'), T('المبلغ', 'Amount')], rows: rows };
  }

      .concat((S.b.lookups.Sub1_OperatingUnit || []).map(function (x) { return ['S1:' + x.c, x.c + ' — ' + x.n]; }))
      .concat((S.b.lookups.Sub2_OperatingUnit || []).map(function (x) { return ['S2:' + x.c, x.c + ' — ' + x.n]; }));

    var filters = '<div class="fin-filters">' +

      '<label>' + T('الوحدة', 'Unit') + '<select class="inp" onchange="FA.finSet(\'unit\', this.value)">' + opt(unitOpts, f.unit) + '</select></label>' +
      (tab === 'ledger' ? '<label>' + T('الحساب', 'Account') + '<input class="inp" list="dl_finacc" dir="ltr" value="' + esc(f.account) + '" placeholder="' + T('كل الحسابات', 'All accounts') +
        '" onchange="FA.finSet(\'account\', this.value)"><datalist id="dl_finacc">' + datalistOpts('@allAccounts', null, {}) + '</datalist></label>' : '') +
      (tab === 'tb' ? '<label class="ck"><input type="checkbox" ' + (f.zero ? 'checked' : '') + ' onchange="FA.finSet(\'zero\', this.checked)"> ' + T('إظهار الحسابات الصفرية', 'Show zero balances') + '</label>' +
        '<label class="ck"><input type="checkbox" ' + (f.headersOnly ? 'checked' : '') + ' onchange="FA.finSet(\'headersOnly\', this.checked)"> ' + T('الحسابات الرئيسية فقط', 'Header accounts only') + '</label>' +
        '<label class="ck"><input type="checkbox" ' + (f.noClosing ? 'checked' : '') + ' onchange="FA.finSet(\'noClosing\', this.checked)"> ' + T('قبل قيد الإقفال', 'Before closing entries') + '</label>' : '') +
      '</div>';
    var rep = tab === 'ledger' ? buildLedger() : tab === 'bs' ? buildBS() : tab === 'is' ? buildIS() : tab === 'cf' ? buildCF() : buildTB();
    S.finRep = rep;

      '<div class="content"><div class="card">' + filters + '<div class="gridwrap" style="max-height:none">' + stmtHtml(rep.heads, rep.rows) + '</div></div>' +

  /** صفحة تقارير الأطراف: الملخص + كشف الحساب. */
  async function pageParty(type, force) {

  /** مبلغ السطر بعملة الطرف. */
  function partyAmt(l, cur) {
    if (low(l[PL.cur] || localCur()) === low(cur)) return { dr: l[PL.cdr], cr: l[PL.ccr] };
    var rate = rateFor(cur, l[PL.date]) || 1;
    return { dr: l[PL.dr] / rate, cr: l[PL.cr] / rate };
  }
  /** تجميع حركة طرف: الافتتاحي (قبل الفترة + قيد الافتتاح) والحركة خلال الفترة. */
  function partyCalc(type, d, p, F) {
    var P = PT[type], ob = 0, dr = 0, cr = 0, obL = 0, drL = 0, crL = 0, postedOpen = false, rows = [];
    d.lines.forEach(function (l) {
      if (low(l[PL.party]) !== low(p.c) || l[PL.date] > F.to) return;
      var a = partyAmt(l, p.cur);
      var isOpen = l[PL.ref] === 'OPENING';
      if (isOpen) postedOpen = true;
      if (l[PL.date] < F.from || isOpen) { ob += (a.dr - a.cr) * P.sign; obL += (l[PL.dr] - l[PL.cr]) * P.sign; return; }
      dr += a.dr; cr += a.cr; drL += l[PL.dr]; crL += l[PL.cr];
      rows.push({ l: l, a: a });
    });
    var unposted = !postedOpen && p.ob ? 1 : 0;
    if (unposted) { ob += p.ob; obL += p.ob * (rateFor(p.cur, F.from) || 1); }
    var cb = ob + (dr - cr) * P.sign;
    return { ob: ob, dr: dr, cr: cr, cb: cb, cbL: obL + (drL - crL) * P.sign, rows: rows, unposted: unposted };
  }

  function partySummary(type, d, F) {
    var P = PT[type], unposted = 0, tot = { ob: 0, dr: 0, cr: 0, cb: 0, cbL: 0 }, curs = {};
    var heads = [T(P.no[0], P.no[1]), T(P.nm[0], P.nm[1]), T('العملة', 'Currency'), T('الرصيد الافتتاحي', 'Opening balance'),
      T('حركة العام — مدين', 'Period movement — debit'), T('حركة العام — دائن', 'Period movement — credit'), T('الرصيد الختامي', 'Closing balance'),
      T('الرصيد الختامي بالعملة المحلية', 'Closing balance (local)') + ' ' + localCur()];
    var rows = [];
    var groups = type === 'Bank' && !F.grp ? (S.b.lookups.BankGroup || []).map(function (g) { return g.c; }).concat(['']) : [null];
    groups.forEach(function (g) {
      var list = d.parties.filter(function (p) { return g === null ? (!F.grp || p.grp === F.grp) : (g ? p.grp === g : !(S.b.lookups.BankGroup || []).some(function (x) { return x.c === p.grp; })); });
      var sub = { ob: 0, dr: 0, cr: 0, cb: 0, cbL: 0 }, out = [];
      list.forEach(function (p) {
        var c = partyCalc(type, d, p, F);
        if (!F.zero && !c.ob && !c.dr && !c.cr) return;
        if (c.unposted) unposted = 1;
        curs[p.cur] = 1;
        out.push({ code: p.c, label: p.n + (c.unposted ? ' *' : ''), cur: p.cur, v: [p.cur, c.ob, c.dr, c.cr, c.cb, c.cbL] });
        ['ob', 'dr', 'cr', 'cb', 'cbL'].forEach(function (k) { sub[k] += c[k]; tot[k] += c[k]; });
      });
      if (!out.length) return;
      if (g !== null) rows.push({ k: 'sec', label: g ? g + ' — ' + lookupName('BankGroup', g) : T('بدون مجموعة', 'No group') });
      rows = rows.concat(out.map(function (r) { r.k = 'acc'; return r; }));
      if (g !== null) rows.push({ k: 'sub', label: T('إجمالي المجموعة', 'Group total'), v: Object.keys(curs).length === 1 ? ['', sub.ob, sub.dr, sub.cr, sub.cb, sub.cbL] : ['', '', '', '', '', sub.cbL] });
    });
    var one = Object.keys(curs).length <= 1;
    rows.push({ k: 'tot', label: T('الإجمالي', 'Total'), v: one ? ['', tot.ob, tot.dr, tot.cr, tot.cb, tot.cbL] : ['', '', '', '', '', tot.cbL] });
    if (!d.parties.length) rows = [{ k: 'note', label: esc(T('لا توجد بيانات — أضف ', 'No data — add ') + T(P.ar, P.en)) }];
    return { title: T('التقرير الإجمالي — ', 'Summary — ') + T(P.ar, P.en), heads: heads, rows: rows, html: stmtHtml(heads, rows), unposted: unposted };
  }

  function partyStatement(type, d, F) {
    var P = PT[type];

    var heads = [T('التاريخ', 'Date'), T('رقم القيد', 'Voucher'), T('البيان', 'Description'), T('مدين', 'Debit'), T('دائن', 'Credit'), T('الرصيد', 'Balance')];

    var c = partyCalc(type, d, p, F), bal = c.ob;
    var body = [];

    var aoa = [heads, [F.from, '', T('رصيد افتتاحي', 'Opening balance'), '', '', r3(bal)]];
    c.rows.sort(function (a, b) { return a.l[PL.date] < b.l[PL.date] ? -1 : a.l[PL.date] > b.l[PL.date] ? 1 : String(a.l[PL.voucher]).localeCompare(String(b.l[PL.voucher]), undefined, { numeric: true }); })
      .forEach(function (x) {
        bal += (x.a.dr - x.a.cr) * P.sign;
        var desc = [x.l[PL.desc], x.l[PL.desc].indexOf(x.l[PL.note]) >= 0 ? '' : x.l[PL.note]].filter(String).join(' — ') + (low(x.l[PL.cur] || localCur()) !== low(p.cur) ? ' [' + x.l[PL.cur] + ']' : '');
        body.push('<tr class="r-acc"><td>' + esc(x.l[PL.date]) + '</td><td><a data-v="' + esc(x.l[PL.voucher]) + '"><bdi>' + esc(x.l[PL.voucher]) + '</bdi></a></td><td>' + esc(desc) + '</td>' +
          '<td class="n">' + (x.a.dr ? fmtNum(x.a.dr, 2) : '') + '</td><td class="n">' + (x.a.cr ? fmtNum(x.a.cr, 2) : '') + '</td><td class="n">' + fmtAcc(bal) + '</td></tr>');
        aoa.push([x.l[PL.date], x.l[PL.voucher], desc, r3(x.a.dr), r3(x.a.cr), r3(bal)]);
      });
    body.push('<tr class="r-tot"><td></td><td></td><td>' + T('الإجمالي / الرصيد الختامي', 'Totals / closing balance') + '</td><td class="n">' + fmtNum(c.dr, 2) + '</td><td class="n">' + fmtNum(c.cr, 2) + '</td><td class="n">' + fmtAcc(c.cb) + '</td></tr>');
    aoa.push(['', '', T('الإجمالي / الرصيد الختامي', 'Totals / closing balance'), r3(c.dr), r3(c.cr), r3(c.cb)]);
    var info = '<div class="pinfo"><span><b>' + esc(T(P.one[0], P.one[1])) + ':</b> <bdi>' + esc(p.c) + '</bdi> — ' + esc(p.n) + '</span><span><b>' + T('العملة', 'Currency') + ':</b> ' + esc(p.cur) + '</span>' +
      '<span><b>' + T('الحساب', 'Account') + ':</b> <bdi>' + esc(p.acc) + '</bdi> ' + esc(lookupName('@allAccounts', p.acc)) + '</span>' +
      '<span><b>' + T('الرصيد الختامي', 'Closing balance') + ':</b> ' + fmtAcc(c.cb) + ' ' + esc(p.cur) + '</span></div>';
    var html = '<table class="stmt pst"><thead><tr>' + heads.map(function (h, i) { return '<th class="' + (i > 2 ? 'n' : '') + '">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + body.join('') + '</tbody></table>';
    return { title: T('كشف حساب ', 'Statement — ') + T(P.one[0], P.one[1]) + ' ' + p.c + ' — ' + p.n, heads: heads, aoa: aoa, html: html, info: info, unposted: c.unposted };
  }

  /* ======================= Amount in Arabic words (تفقيط) ======================= */
  function tafqeet(n, cur) {
    var ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر',
      'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    var tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    var hund = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
    var sc = [null, ['ألف', 'ألفان', 'آلاف', 'ألفاً'], ['مليون', 'مليونان', 'ملايين', 'مليوناً'], ['مليار', 'ملياران', 'مليارات', 'ملياراً']];
    var u1000 = function (x) {
      var p = [], h = Math.floor(x / 100), r = x % 100;
      if (h) p.push(hund[h]);
      if (r) p.push(r < 20 ? ones[r] : (r % 10 ? ones[r % 10] + ' و' + tens[Math.floor(r / 10)] : tens[Math.floor(r / 10)]));
      return p.join(' و');
    };
    n = Math.round((Number(n) || 0) * 100) / 100;
    var whole = Math.floor(n), frac = Math.round((n - whole) * 100), parts = [];
    for (var g = 3; g >= 0; g--) {
      var c = Math.floor(whole / Math.pow(1000, g)) % 1000;
      if (!c) continue;
      if (!g) { parts.push(u1000(c)); continue; }
      var w = sc[g];
      parts.push(c === 1 ? w[0] : c === 2 ? w[1] : c <= 10 ? u1000(c) + ' ' + w[2] : c % 100 >= 11 ? u1000(c) + ' ' + w[3] : u1000(c) + ' ' + w[0]);
    }
    var txt = (parts.join(' و') || 'صفر') + ' ' + (cur || '');
    if (frac) txt += ' و' + u1000(frac) + ' من مائة';
    return 'فقط ' + txt + ' لا غير';
  }

  function cashChange(form, k, el) {
    if (k === 'BANKACCOUNTID') {

      var cur = (b && b.cur) || localCur();
      setVal(form, 'CURRENCYCODE', cur);

    }
    if (k === 'TRANSDATE') {
      var c = readForm(form).CURRENCYCODE;
      if (c && c.toUpperCase() !== localCur()) setVal(form, 'EXCHANGERATE', rateFor(c, el.value) || '');
    }
    if (k === 'PARTYTYPE') { setVal(form, 'PARTYID', ''); setVal(form, 'INVOICEID', ''); rebuildList(form, 'PARTYID'); rebuildList(form, 'INVOICEID'); }
    if (k === 'INVOICEID' && el.value) {
      var inv = refFind(S.b.refs.invoices, el.value), rf = readForm(form);
      if (inv && !Number(parseNum(rf.AMOUNT))) setVal(form, 'AMOUNT', Math.round(inv.rem * inv.rate / (Number(parseNum(rf.EXCHANGERATE)) || 1) * 1000) / 1000);
      if (inv && !rf.DESCRIPTION) setVal(form, 'DESCRIPTION', (inv.t === 'Sales' ? T('تحصيل الفاتورة ', 'Receipt for invoice ') : T('سداد الفاتورة ', 'Payment of invoice ')) + inv.c);

      setVal(form, 'PARTYTYPE', el.value === 'Payment' ? 'Vendor' : 'Customer'); rebuildList(form, 'PARTYID');

    var form = $('[data-form="invoices"]');

    var head = readForm(form);

    if (!isNew) head.INVOICEID = S.view.id;
    var st = S.b.settings, defAcc = invLineAcc(null);

      .map(function (l) { return { ITEMID: l.ITEMID, ITEMDESCRIPTION: l.ITEMDESCRIPTION, UNIT: l.UNIT, MAINACCOUNTID: l.MAINACCOUNTID || (l.ITEMID ? '' : defAcc || ''),
        QTY: parseNum(l.QTY), UNITPRICE: parseNum(l.UNITPRICE), TAXPERCENT: parseNum(l.TAXPERCENT) }; });
    var KL = KIND[head.INVOICETYPE] || KIND.Sales;
    if (post && !(await confirmBox(T('حفظ ' + KL.ar + ' وترحيل قيده الآن؟', 'Save the ' + KL.en + ' and post its journal entry now?')))) return;
    try {
      var r = await api('saveInvoice', S.token, head, lines, !!isNew, !!post);
      toast((post ? T('تم ترحيل ', 'Posted ') + r.id + T(' — القيد ', ' — entry ') + r.gl : T('تم حفظ ', 'Saved ') + r.id), 'ok');
      await Promise.all([load('invoices', true), load('invlines', true)]);
      await refreshRefs();
      S.party = {}; delete S.data.glheaders; delete S.data.gllines;
      go(S.page, { id: r.id });

  }

  /** فتح سند قبض/صرف جاهز بالمتبقي على الفاتورة. */
  function invPay() {

      INVOICEID: h.INVOICEID, BANKACCOUNTID: bank.c || '', CURRENCYCODE: bcur, EXCHANGERATE: brate, AMOUNT: Math.round(amt * 1000) / 1000,
      DESCRIPTION: (sales ? T('تحصيل الفاتورة ', 'Receipt for invoice ') : T('سداد الفاتورة ', 'Payment of invoice ')) + h.INVOICEID } });
  }

  /* ======================= Aging (أعمار الديون) ======================= */
  var AGE_B = [['nd', 'لم يستحق', 'Not due'], ['b1', '0–30 يوماً', '0–30 days'], ['b2', '31–60 يوماً', '31–60 days'], ['b3', '61–90 يوماً', '61–90 days'], ['b4', 'أكثر من 90 يوماً', 'Over 90 days']];
  function daysBetween(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
  function ageBucket(days) { return days < 0 ? 'nd' : days <= 30 ? 'b1' : days <= 60 ? 'b2' : days <= 90 ? 'b3' : 'b4'; }
  function partyAging(type, d, F) {
    var P = PT[type], A = S.aging[type];
    var asOf = A.asOf;
    var heads = [T(P.no[0], P.no[1]), T(P.nm[0], P.nm[1]), T('العملة', 'Currency')].concat(AGE_B.map(function (b) { return T(b[1], b[2]); })).concat([T('الإجمالي', 'Total')]);
    var by = {}, order = [];
    A.invoices.forEach(function (x) {
      var k = low(x.party);
      if (!by[k]) { by[k] = { c: x.party, n: x.name, cur: x.cur, rate: x.rate, inv: [], s: { nd: 0, b1: 0, b2: 0, b3: 0, b4: 0, t: 0 } }; order.push(k); }
      x.days = daysBetween(x.due, asOf); x.b = ageBucket(x.days);
      by[k].inv.push(x); by[k].s[x.b] += x.rem; by[k].s.t += x.rem;
      by[k].loc = (by[k].loc || 0) + x.rem * x.rate;
      by[k].locB = by[k].locB || { nd: 0, b1: 0, b2: 0, b3: 0, b4: 0, t: 0 };
      by[k].locB[x.b] += x.rem * x.rate; by[k].locB.t += x.rem * x.rate;
    });
    var parties = order.map(function (k) { return by[k]; }).sort(function (a, b) { return b.s.b4 - a.s.b4 || b.s.t - a.s.t; });
    if (F.overdue) parties = parties.filter(function (p) { return p.s.b1 + p.s.b2 + p.s.b3 + p.s.b4 > 0.0005; });
    var tot = { nd: 0, b1: 0, b2: 0, b3: 0, b4: 0, t: 0 }, curs = {};
    var cell = function (k, v) { return '<td class="n ' + (v > 0.0005 ? 'ag-' + k : '') + '">' + (v > 0.0005 ? fmtNum(v, 2) : '-') + '</td>'; };
    var body = [], aoa = [heads];
    parties.forEach(function (p) {
      curs[p.cur] = 1;
      Object.keys(tot).forEach(function (k) { tot[k] += p.locB[k]; });
      body.push('<tr class="r-acc ag-p"><td><bdi>' + esc(p.c) + '</bdi></td><td>' + esc(p.n) + '</td><td>' + esc(p.cur) + '</td>' + AGE_B.map(function (b) { return cell(b[0], p.s[b[0]]); }).join('') + '<td class="n"><b>' + fmtNum(p.s.t, 2) + '</b></td></tr>');
      aoa.push([p.c, p.n, p.cur].concat(AGE_B.map(function (b) { return r3(p.s[b[0]]); })).concat([r3(p.s.t)]));
      if (F.detail) p.inv.sort(function (a, b) { return a.due < b.due ? -1 : 1; }).forEach(function (x) {
        body.push('<tr class="ag-inv"><td><a data-inv="' + esc(x.id) + '" data-pg="' + ((KIND[x.type] || {}).page || '') + '"><bdi>' + esc(x.id) + '</bdi></a></td><td>' + T('تاريخ ', 'Date ') + esc(x.date) + T(' — استحقاق ', ' — due ') + esc(x.due) +
          (x.days > 0 ? ' — <b>' + T('متأخرة ', 'overdue ') + x.days + T(' يوماً', ' days') + '</b>' : '') + '</td><td>' + esc(x.cur) + '</td>' +
          AGE_B.map(function (b) { return b[0] === x.b ? cell(b[0], x.rem) : '<td class="n"></td>'; }).join('') + '<td class="n">' + fmtNum(x.rem, 2) + '</td></tr>');
        aoa.push(['  ' + x.id, x.date + ' / ' + x.due + ' (' + x.days + ')', x.cur].concat(AGE_B.map(function (b) { return b[0] === x.b ? r3(x.rem) : ''; })).concat([r3(x.rem)]));
      });
    });
    var mixed = Object.keys(curs).length > 1;
    var totLabel = T('الإجمالي', 'Total') + (mixed || (Object.keys(curs)[0] || localCur()) !== localCur() ? ' (' + T('بالعملة المحلية', 'local currency') + ' ' + localCur() + ')' : '');
    if (!parties.length) body.push('<tr class="r-note"><td colspan="' + heads.length + '">' + T('لا توجد فواتير غير مسددة حتى هذا التاريخ.', 'No unpaid invoices as of this date.') + '</td></tr>');
    else {
      body.push('<tr class="r-tot"><td></td><td>' + esc(totLabel) + '</td><td></td>' + AGE_B.map(function (b) { return '<td class="n">' + fmtNum(tot[b[0]], 2) + '</td>'; }).join('') + '<td class="n">' + fmtNum(tot.t, 2) + '</td></tr>');
      body.push('<tr class="r-sub"><td></td><td>' + T('النسبة من الإجمالي', 'Share of total') + '</td><td></td>' + AGE_B.map(function (b) { return '<td class="n">' + (tot.t ? fmtNum(tot[b[0]] / tot.t * 100, 1) + '%' : '-') + '</td>'; }).join('') + '<td class="n">100%</td></tr>');
      aoa.push(['', totLabel, ''].concat(AGE_B.map(function (b) { return r3(tot[b[0]]); })).concat([r3(tot.t)]));
    }
    var overdue = tot.b1 + tot.b2 + tot.b3 + tot.b4;
    var info = parties.length ? '<div class="pinfo"><span><b>' + T('كما في', 'As of') + ':</b> ' + esc(asOf) + '</span><span><b>' + T('إجمالي المستحق', 'Total outstanding') + ':</b> ' + fmtNum(tot.t, 2) + ' ' + esc(localCur()) + '</span>' +
      '<span><b>' + T('المتأخر', 'Overdue') + ':</b> ' + fmtNum(overdue, 2) + ' (' + (tot.t ? fmtNum(overdue / tot.t * 100, 1) : 0) + '%)</span>' +
      '<span><b>' + T('أكثر من 90 يوماً', 'Over 90 days') + ':</b> <span class="ag-b4">' + fmtNum(tot.b4, 2) + '</span></span></div>' : '';
    var html = '<table class="stmt aging"><thead><tr>' + heads.map(function (h, i) { return '<th class="' + (i > 2 ? 'n' : '') + '">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + body.join('') + '</tbody></table>';
    return { title: T('أعمار الديون — ', 'Aging — ') + T(P.ar, P.en), heads: heads, aoa: aoa, html: html, info: info };

  var MONTHS_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

  /** أعمدة شهرية مزدوجة بمحور واحد. الشهر الأول في جهة بداية القراءة (يمين في العربية). */
  function sdChart(ns, np) {
    var rtl = S.lang === 'ar';
    // في العربية: الأشهر من اليمين لليسار ومحور القيم على اليمين
    var W = 900, H = 280, L = rtl ? 12 : 70, R = rtl ? 70 : 12, Tp = 14, B = 34;
    var max = Math.max.apply(null, ns.concat(np).concat([0])), min = Math.min.apply(null, ns.concat(np).concat([0]));
    if (max === min) max = min + 1;
    var step = Math.pow(10, Math.floor(Math.log10((max - min) / 4))), nice = [1, 2, 2.5, 5, 10].map(function (k) { return k * step; }).filter(function (k) { return (max - min) / k <= 5; })[0] || step * 10;
    var top = Math.ceil(max / nice) * nice, bot = Math.floor(min / nice) * nice;
    var yv = function (v) { return Tp + (top - v) / (top - bot) * (H - Tp - B); };
    var cw = (W - L - R) / 12, bw = Math.min(22, cw * 0.32);
    var g = '';
    for (var t = bot; t <= top + nice / 2; t += nice) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yv(t) + '" y2="' + yv(t) + '" class="sd-grid' + (Math.abs(t) < nice / 2 ? ' z' : '') + '"/>' +
        '<text x="' + (rtl ? W - R + 8 : L - 8) + '" y="' + (yv(t) + 4) + '" class="sd-ax" text-anchor="' + (rtl ? 'start' : 'end') + '">' + esc(compact(t)) + '</text>';
    }
    var bar = function (x, v, c, i, k) {
      var y1 = yv(Math.max(v, 0)), y2 = yv(Math.min(v, 0)), h = Math.max(y2 - y1, v ? 1 : 0);
      if (!h) return '';
      var r = Math.min(4, h), up = v >= 0;
      var d = up ? 'M' + x + ',' + (y1 + h) + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y1 + ' ' + (x + bw) + ',' + (y1 + r) + 'V' + (y1 + h) + 'Z'
        : 'M' + x + ',' + y1 + 'V' + (y1 + h - r) + 'Q' + x + ',' + (y1 + h) + ' ' + (x + r) + ',' + (y1 + h) + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + (y1 + h) + ' ' + (x + bw) + ',' + (y1 + h - r) + 'V' + y1 + 'Z';
      return '<path d="' + d + '" fill="' + c + '"/>';
    };
    var marks = '', hits = '';
    for (var i = 0; i < 12; i++) {
      var slot = rtl ? 11 - i : i, cx = L + cw * slot + cw / 2;
      marks += bar(cx - bw - 1, ns[i], SD_C.s, i, 's') + bar(cx + 1, np[i], SD_C.p, i, 'p');
      g += '<text x="' + cx + '" y="' + (H - B + 18) + '" class="sd-ax" text-anchor="middle">' + esc(sdMonth(i)) + '</text>';
      hits += '<rect class="sd-hit" data-m="' + i + '" x="' + (L + cw * slot) + '" y="' + Tp + '" width="' + cw + '" height="' + (H - Tp - B) + '"/>';
    }
    return '<div class="sd-chart"><svg direction="ltr" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(T('المبيعات والمشتريات الشهرية', 'Monthly sales and purchases')) + '">' + g + marks + hits + '</svg><div class="sd-tip hidden" id="sdTip"></div></div>';
  }

    var opt = function (list, v) { return list.map(function (x) { return '<option value="' + esc(x[0]) + '"' + (String(x[0]) === String(v) ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join(''); };

  function buildBudgetCtl() {
    var f = S.bcF, d = S.bud, n = f.m2 - f.m1 + 1;
    if (n < 1) n = 0;
    var unitOk = function (ou, s1, s2) {
      if (!f.unit) return true;
      var p = f.unit.split(':'), c = low(p.slice(1).join(':'));
      return low(p[0] === 'OU' ? ou : p[0] === 'S1' ? s1 : s2) === c;
    };
    var unitKey = function (ou, s1, s2) { return f.level === 'OU' ? ou : f.level === 'S1' ? s1 : f.level === 'S2' ? s2 : ''; };
    var lk = f.level === 'OU' ? 'OperatingUnit' : f.level === 'S1' ? 'Sub1_OperatingUnit' : 'Sub2_OperatingUnit';
    var m = {}, order = [];
    var get = function (acc, u) {
      var k = low(acc) + '|' + low(u);
      if (!m[k]) { m[k] = { acc: acc, u: u, b: 0, a: 0 }; order.push(k); }
      return m[k];
    };
    var budAcc = {};
    d.budgets.forEach(function (b) {
      if (!unitOk(b.ou, b.s1, b.s2)) return;
      budAcc[low(b.acc)] = 1;
      get(b.acc, unitKey(b.ou, b.s1, b.s2)).b += b.per === 'Monthly' ? b.amt * n : b.amt * n / 12;
    });
    d.actual.forEach(function (l) {
      var mo = Number(String(l[0]).slice(5, 7));
      if (mo < f.m1 || mo > f.m2 || !budAcc[low(l[1])] || !unitOk(l[2], l[3], l[4])) return;
      var t = d.types[l[1]] || '';
      get(l[1], unitKey(l[2], l[3], l[4])).a += (t === 'Revenue' || t === 'Liability' || t === 'Equity') ? -l[5] : l[5];
    });
    var heads = [T('رقم الحساب', 'Account'), T('اسم الحساب', 'Account name'), T('الوحدة', 'Unit'), T('التقديري', 'Budget'), T('الفعلي', 'Actual'), T('الفارق', 'Variance'), T('نسبة الفارق', 'Variance %')];
    var rows = order.map(function (k) { return m[k]; }).sort(function (a, b) { return String(a.acc).localeCompare(String(b.acc), undefined, { numeric: true }) || String(a.u).localeCompare(String(b.u)); });
    var tot = { e: { b: 0, a: 0, n: 0 }, r: { b: 0, a: 0, n: 0 } }, body = [], aoa = [heads];
    rows.forEach(function (r) {
      var t = d.types[r.acc] || '', rev = t === 'Revenue';
      var v = r.a - r.b, pct = r.b ? v / r.b * 100 : (r.a ? 100 : 0);
      var bad = rev ? v < -0.0005 : v > 0.0005;
      if (f.over && !bad) return;
      var tk = tot[rev ? 'r' : 'e']; tk.b += r.b; tk.a += r.a; tk.n++;
      var unit = f.level ? (r.u ? r.u + ' — ' + lookupName(lk, r.u) : T('بدون وحدة', 'No unit')) : T('كل الوحدات', 'All units');
      body.push('<tr class="r-acc' + (bad ? ' bad' : '') + '"><td><bdi>' + esc(r.acc) + '</bdi></td><td>' + esc(lookupName('@allAccounts', r.acc)) + '</td><td><bdi>' + esc(unit) + '</bdi></td>' +
        '<td class="n">' + fmtAcc(r.b) + '</td><td class="n">' + fmtAcc(r.a) + '</td><td class="n v">' + fmtAcc(v) + '</td><td class="n v">' + (r.b || r.a ? fmtNum(pct, 1) + '%' : '-') + '</td></tr>');
      aoa.push([r.acc, lookupName('@allAccounts', r.acc), unit, r3(r.b), r3(r.a), r3(v), Math.round(pct * 10) / 10]);
    });
    if (!body.length) body.push('<tr class="r-note"><td colspan="7">' + T('لا توجد سطور موازنة لهذه السنة / الفلتر — أضفها من صفحة إدخال الموازنة.', 'No budget lines for this year/filter — add them on the budget entry page.') + '</td></tr>');
    [['r', T('إجمالي الإيرادات', 'Total revenue')], ['e', T('إجمالي المصروفات والحسابات الأخرى', 'Total expenses & other')]].forEach(function (x) {
      var t = tot[x[0]];
      if (!t.n) return;
      var tv = t.a - t.b, bad = x[0] === 'r' ? tv < -0.0005 : tv > 0.0005;
      body.push('<tr class="r-tot' + (bad ? ' bad' : '') + '"><td></td><td>' + esc(x[1]) + '</td><td></td><td class="n">' + fmtAcc(t.b) + '</td><td class="n">' + fmtAcc(t.a) + '</td><td class="n v">' + fmtAcc(tv) + '</td><td class="n v">' + (t.b ? fmtNum(tv / t.b * 100, 1) + '%' : '-') + '</td></tr>');
      aoa.push(['', x[1], '', r3(t.b), r3(t.a), r3(tv), t.b ? Math.round(tv / t.b * 1000) / 10 : '']);
    });
    var html = '<table class="stmt bct"><thead><tr>' + heads.map(function (h, i) { return '<th class="' + (i > 2 ? 'n' : '') + '">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + body.join('') + '</tbody></table>';
    return { html: html, aoa: aoa };
  }

  async function saveSettings() {
    var d = {};
    $$('[data-s]').forEach(function (el) { d[el.getAttribute('data-s')] = el.value; });
    try {
      S.b.settings = await api('saveSettings', S.token, d);
      chrome();
      toast(T('تم حفظ الإعدادات', 'Settings saved'), 'ok');
      render();
    } catch (e) { fail(e); }
  }

  function logoPicked(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = async function () {
        var scale = Math.min(1, 240 / img.width, 120 / img.height);
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var url = c.toDataURL('image/png');
        if (url.length > 45000) url = c.toDataURL('image/jpeg', 0.85);
        try {
          await api('saveLogo', S.token, url);
          S.b.settings.LOGO = url;
          chrome();
          toast(T('تم تحديث الشعار', 'Logo updated'), 'ok');
          render();
        } catch (e) { fail(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  async function removeLogo() {
    try { await api('saveLogo', S.token, ''); S.b.settings.LOGO = ''; chrome(); render(); } catch (e) { fail(e); }
