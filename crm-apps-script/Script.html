// ───────── State & helpers ─────────
const S = { token: '', user: null, settings: {}, lookups: { groups: [], collectors: [], customers: [], transactionTypes: [] },
  lang: 'ar', view: '', lists: {}, rows: {}, rep: {}, exportData: null, badges: {} };

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const t = (k, vars) => {
  let s = (I18N[S.lang] && I18N[S.lang][k]) || I18N.en[k] || k;
  if (vars) Object.keys(vars).forEach(v => { s = s.replace('{' + v + '}', vars[v]); });
  return s;
};
const NF = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => NF.format(+n || 0);
const short = n => { n = +n || 0; const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : a >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : NF.format(n); };
const cur = () => S.settings.LocalCurrency || '';
const z = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
const today = () => ymd(new Date());
const monthStart = () => today().slice(0, 8) + '01';
const yearStart = () => today().slice(0, 5) + '01-01';
const can = a => S.user && (S.user.isAdmin || S.user['can' + a[0].toUpperCase() + a.slice(1)]);
const hasPage = p => S.user && S.user.pages.indexOf(p) > -1;
const groupName = id => { const g = S.lookups.groups.find(x => x.id === id); return g ? g.name : (id || ''); };
const collectorName = u => { if (!u) return t('unassigned'); const c = S.lookups.collectors.find(x => x.username === u); return c ? c.name : u; };
const pill = (txt, cls) => `<span class="health ${cls}">${esc(txt)}</span>`;
const statusPill = v => pill(t(v || 'Active'), { Active: 'healthy', Inactive: 'neutral', Blocked: 'risk', Draft: 'watch', Posted: 'healthy', Open: 'info', Done: 'healthy', Broken: 'risk' }[v] || 'neutral');
const daysPill = d => pill(d + ' ' + t('day'), d > 90 ? 'risk' : d > 30 ? 'watch' : 'info');
const numCell = n => `<span class="${+n < 0 ? 'neg' : ''}">${money(n)}</span>`;

// ───────── Server bridge ─────────
let pending = 0;
function setLoading(d) { pending = Math.max(0, pending + d); $('#loading').hidden = pending === 0; }
function run(fn, ...args) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
  });
}
function errText(e) {
  const msg = String((e && e.message) || e);
  const code = (msg.match(/\b[A-Z][A-Z_]{4,}\b/) || [])[0];
  return code && I18N.en['err_' + code] ? t('err_' + code) : msg.replace(/^(Exception|Error):\s*/, '');
}
async function api(fn, ...args) {
  setLoading(1);
  try { return await run(fn, ...args); }
  catch (e) {
    if (/SESSION_EXPIRED/.test(String(e && e.message || e))) { signOutLocal(); }
    toast(errText(e), 'error');
    throw e;
  } finally { setLoading(-1); }
}

let toastTimer;
function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg; el.className = 'toast ' + (kind || 'ok'); el.hidden = false;

}

async function doLogin(form) {

  try {

    const r = await run('login', form.u.value, form.p.value);
    onLogin(r);
  } catch (e) {
    renderLogin(errText(e));
  } finally { setLoading(-1); }
}

function onLogin(r) {
  S.token = r.token; S.user = r.user; S.settings = r.settings || {}; S.lookups = r.lookups;
  store.set('crm_token', r.token);
  renderShell();
  const last = store.get('crm_view');
  go(last && hasPage(last) ? last : S.user.pages[0]);
}

function signOutLocal() {
  S.token = ''; S.user = null; store.set('crm_token', null);

function opts(list, value, withAll) {
  return (withAll ? `<option value="">${t('all')}</option>` : '') +

function tool(key, label, type, value, options) {
  let input;
  if (type === 'select') input = `<select data-f="${key}">${opts(options, value, true)}</select>`;
  else if (type === 'customer') input = `<input data-f="${key}" list="dl_customers" value="${esc(value)}" placeholder="${t('all')}">`;
  else if (type === 'check') return `<label class="check" style="flex:0 0 auto"><input type="checkbox" data-f="${key}" ${value ? 'checked' : ''}>${label}</label>`;
  else input = `<input data-f="${key}" type="${type || 'text'}" value="${esc(value)}" ${type === 'search' ? `placeholder="${t('search')}"` : ''}>`;
  return `<label class="tool">${esc(label)}${input}</label>`;
}
function readTools(el) {
  const o = {};
  $$('[data-f]', el).forEach(i => { o[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
  return o;
}

/**
 * cols: [{k, l, f(value,row) → html, num, cls}]
 * opts: { rowClass, actions(row,i) → html, foot: html, select(row) → bool }
 */
function table(view, cols, rows, o) {
  o = o || {};
  S.rows[view] = rows;
  if (!rows.length) return `<div class="empty">${t('noData')}</div>`;
  const st = S.lists[view];
  const sortable = !!(st && o.sortable !== false);
  const th = cols.map(c => {
    const arrow = sortable && st.sort === c.k ? (st.desc ? ' ↓' : ' ↑') : '';
    return `<th class="${c.num ? 'num' : ''} ${sortable && c.k ? 'sortable' : ''}" ${sortable && c.k ? `data-sort="${c.k}"` : ''}>${esc(c.l)}${arrow}</th>`;
  }).join('');
  const body = rows.map((r, i) => `<tr data-i="${i}" class="${o.click ? 'click' : ''}">` +
    (o.select ? `<td class="actions-cell" data-label="">${o.select(r) ? `<label class="check"><input type="checkbox" data-sel="${esc(r.rowId)}"></label>` : ''}</td>` : '') +
    cols.map(c => {
      const v = r[c.k];
      const html = c.f ? c.f(v, r) : c.num ? numCell(v) : esc(v);
      return `<td data-label="${esc(c.l)}" class="${c.num ? 'num' : ''} ${c.cls || ''}">${html}</td>`;
    }).join('') +
    (o.actions ? `<td class="actions-cell" data-label=""><div class="row-actions">${o.actions(r, i)}</div></td>` : '') +
    '</tr>').join('');
  return `<div class="table-wrap"><table class="cards" data-view="${view}"><thead><tr>${o.select ? '<th></th>' : ''}${th}${o.actions ? '<th></th>' : ''}</tr></thead>
    <tbody>${body}</tbody>${o.foot ? `<tfoot>${o.foot}</tfoot>` : ''}</table></div>`;
}

function footRow(cols, totals, label, lead) {
  return '<tr>' + (lead ? '<td data-label=""></td>' : '') + cols.map((c, i) =>
    `<td data-label="${esc(c.l)}" class="${c.num ? 'num' : ''}">${i === 0 ? esc(label) : totals[c.k] !== undefined ? numCell(totals[c.k]) : ''}</td>`).join('') + '</tr>';
}

function pager(view, res) {
  const pages = Math.max(1, Math.ceil(res.total / res.pageSize));
  return `<div class="pager" data-view="${view}"><span>${res.total} ${t('rowsWord')} · ${t('page')} ${res.page} ${t('of')} ${pages}</span>
    <div class="pager-btns">
      <select data-pagesize>${opts([[25, '25'], [50, '50'], [100, '100'], [250, '250']], res.pageSize)}</select>
      <button class="button-ghost" data-act="page" data-p="${res.page - 1}" ${res.page <= 1 ? 'disabled' : ''}>${t('prev')}</button>
      <button class="button-ghost" data-act="page" data-p="${res.page + 1}" ${res.page >= pages ? 'disabled' : ''}>${t('next')}</button>
    </div></div>`;
}

function stat(label, value, mark, markCls, foot) {
  return `<article class="panel stat"><div class="stat-top"><div><div class="stat-label">${esc(label)}</div><div class="stat-value">${value}</div></div>
    <div class="stat-mark ${markCls || ''}">${mark}</div></div>${foot ? `<div class="stat-foot">${foot}</div>` : ''}</article>`;
}

  const res = await call('listRecords', cfg.entity, { q: s.q, filters: s.filters, page: s.page, pageSize: s.pageSize, sort: s.sort, desc: s.desc, dateFrom: s.dateFrom, dateTo: s.dateTo });
  s.page = res.page;
  const cols = cfg.cols();
  const actions = cfg.actions && ((r, i) => cfg.actions(r, i));
  const foot = view === 'transactions' && res.rows.length ? footRow(cols, { debitMST: res.totals.debit, creditMST: res.totals.credit }, t('all') + ' (' + res.total + ')', cfg.select && can('post')) + '' : '';

    case 'customer': return `<label class="${cls}">${label}<input name="${f.k}" list="dl_customers" value="${esc(v)}" ${req} autocomplete="off">${hint}</label>`;

      `<label class="check"><input type="checkbox" name="${k}" ${rec[k] ? 'checked' : ''}>${t('f_' + k)}</label>`).join('')}</div></div>`;
    case 'pages': {
      const sel = String(v || '').split(',');
      return `<div class="${cls}">${label}<div class="check-grid">${PAGES.map(p =>
        `<label class="check"><input type="checkbox" name="page" value="${p.id}" ${sel.indexOf(p.id) > -1 ? 'checked' : ''}>${t('p_' + p.id)}</label>`).join('')}</div></div>`;
    }
    default: return `<label class="${cls}">${label}<input name="${f.k}" type="${f.type || 'text'}" ${f.type === 'number' ? 'step="any"' : ''} value="${esc(v)}" ${req} ${f.lock && !isNew ? 'readonly' : ''} ${f.type === 'password' ? 'autocomplete="new-password"' : ''}>${hint}</label>`;
  }
}

function openForm(entity, rec, isNew) {
  rec = Object.assign({}, rec || {});
  const fields = FORMS[entity]().filter(f => !f.hide);
  FORM = { entity, rec, isNew, fields };
  openDrawer(`
    <div class="drawer-head"><h2>${isNew ? '＋ ' : '✎ '}${t(ENTITY_TITLE[entity])}</h2><button class="icon-button" data-act="closeDrawer" aria-label="${t('close')}">×</button></div>
    <form class="form-panel" id="recForm" style="padding:16px 0 0">
      <div class="form-grid">${fields.map(f => fieldHtml(f, rec, isNew)).join('')}</div>
      <div class="form-actions"><button type="button" class="button-ghost" data-act="closeDrawer">${t('cancel')}</button><button class="button-primary" type="submit">${t('save')}</button></div>
    </form>`);
}

async function submitForm(form) {
  const { entity, rec, isNew, fields } = FORM;
  const data = {};
  const idKey = { Customers: 'account', Transactions: 'rowId', CustomerGroups: 'groupId', FollowUps: 'id', Users: 'userId' }[entity];
  if (!isNew) data[idKey] = rec[idKey];
  fields.forEach(f => {
    if (f.type === 'flags') ['canAdd', 'canEdit', 'canDelete', 'canPost'].forEach(k => { data[k] = form.elements[k].checked; });
    else if (f.type === 'pages') data.pages = $$('input[name=page]:checked', form).map(i => i.value).join(',');
    else if (f.type === 'check') data[f.k] = form.elements[f.k].checked;
    else data[f.k] = form.elements[f.k].value.trim();
  });
  if ((entity === 'Transactions' || entity === 'FollowUps') && !S.lookups.customers.some(c => c.account === data.account)) {
    toast(t('err_NOT_FOUND') + ': ' + data.account, 'error'); return;
  }
  const b = form.querySelector('button[type=submit]'); b.disabled = true;
  try {
    await call('saveRecord', entity, data, isNew);
    toast(t('saved'));
    closeDrawer();
    if (['Customers', 'CustomerGroups', 'Users'].indexOf(entity) > -1) await refreshLookups();
    reload();
  } catch (e) { b.disabled = false; }
}

// Report runner — reads the tool bar, calls the matching server report, renders it.
async function runReport() {
  const view = S.view;
  const tools = $('#repTools');
  const f = Object.assign(S.rep[view], readTools(tools));
  const out = () => $('#repOut');
  if (view === 'balances') {
    const r = await call('reportBalances', f);
    if (S.view !== view) return;
    const cols = [{ k: 'account', l: t('f_account') }, { k: 'name', l: t('f_name'), cls: 'wrap' }, { k: 'group', l: t('f_group'), f: v => esc(groupName(v)) },
      { k: 'collector', l: t('f_collector'), f: v => esc(collectorName(v)) },
      { k: 'opening', l: t('opening'), num: true }, { k: 'debit', l: t('debit'), num: true }, { k: 'credit', l: t('credit'), num: true }, { k: 'closing', l: t('closing'), num: true }];
    S.exportData = { name: 'balances_' + r.from + '_' + r.to, cols, rows: r.rows };
    out().innerHTML = `<section class="stats four">
        ${stat(t('opening'), short(r.totals.opening), '◐', '')}${stat(t('debit'), short(r.totals.debit), '↑', 'amber')}
        ${stat(t('credit'), short(r.totals.credit), '↓', 'green')}${stat(t('closing'), short(r.totals.closing), '$', 'red', `<span>${r.rows.length} ${t('customersCount')}</span>`)}</section>
      <section class="panel">${table('balances', cols, r.rows, { click: true, sortable: false, foot: footRow(cols, r.totals, t('all')) })}</section>`;
  } else if (view === 'paid') {
    const r = await call('reportPaidInvoices', f);
    if (S.view !== view) return;
    const cols = [{ k: 'voucher', l: t('f_voucher') }, { k: 'name', l: t('f_name'), cls: 'wrap' }, { k: 'date', l: t('f_date') }, { k: 'dueDate', l: t('f_dueDate') },
      { k: 'paidDate', l: t('paidDate') }, { k: 'amount', l: t('amount'), num: true },
      { k: 'lateDays', l: t('lateDays'), f: v => v ? daysPill(v) : pill(t('onTime'), 'healthy') }, { k: 'collector', l: t('f_collector'), f: v => esc(collectorName(v)) }];
    S.exportData = { name: 'paid_invoices', cols, rows: r.rows };
    out().innerHTML = `<section class="stats four">
        ${stat(t('paidCount'), r.totals.count, '✓', 'green')}${stat(t('totalPaid'), short(r.totals.amount), '$', '')}
        ${stat(t('onTime'), r.totals.onTime, '◷', 'green')}${stat(t('late'), r.totals.late, '!', 'red')}</section>
      <section class="panel">${table('paid', cols, r.rows, { click: true, sortable: false, foot: footRow(cols, { amount: r.totals.amount }, t('all')) })}</section>`;
  } else if (view === 'overdue') {
    const r = await call('reportOverdue', f);
    if (S.view !== view) return;
    setBadge('overdue', f.account || f.group || f.collector ? S.badges.overdue : r.totals.customers);
    const rows = f.bucket ? r.rows.filter(x => x.bucket === f.bucket) : r.rows;
    const invCols = [{ k: 'voucher', l: t('f_voucher') }, { k: 'name', l: t('f_name'), cls: 'wrap' }, { k: 'date', l: t('f_date') }, { k: 'dueDate', l: t('f_dueDate') },
      { k: 'amount', l: t('amount'), num: true }, { k: 'remaining', l: t('remaining'), num: true }, { k: 'days', l: t('days'), f: daysPill },
      { k: 'collector', l: t('f_collector'), f: v => esc(collectorName(v)) }, { k: 'lastFollowUp', l: t('lastFollowUp') }];
    const custRows = f.bucket ? groupCustomers(rows) : r.customers;
    const custCols = [{ k: 'name', l: t('f_name'), cls: 'wrap' }, { k: 'account', l: t('f_account') }, { k: 'count', l: t('invoices') },
      { k: 'remaining', l: t('overdueAmt'), num: true }, { k: 'maxDays', l: t('maxDays'), f: daysPill }, { k: 'collector', l: t('f_collector'), f: v => esc(collectorName(v)) },
      { k: 'phone', l: t('f_phone') }, { k: 'lastFollowUp', l: t('lastFollowUp') }, { k: 'promiseDate', l: t('f_promiseDate') }];

    S.exportData = byCust ? { name: 'overdue_customers', cols: custCols, rows: custRows } : { name: 'overdue_invoices', cols: invCols, rows };
    const sumRem = rows.reduce((a, x) => a + x.remaining, 0);
    out().innerHTML = `<section class="stats four">
        ${stat(t('overdueAmt'), `${short(sumRem)} <small>${esc(cur())}</small>`, '!', 'red')}${stat(t('overdueInvoices'), rows.length, '▤', 'amber')}
        ${stat(t('overdueCustomers'), custRows.length, '♙', '')}${stat(t('avgDays'), r.totals.avgDays + ' <small>' + t('day') + '</small>', '⏱', 'amber')}</section>
      <section class="panel" style="padding:14px 16px;margin-bottom:16px"><div class="legend" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        ${['b1', 'b2', 'b3', 'b4'].map((b, i) => `<div><div class="legend-row"><i class="dot ${['', 'amber', 'orange', 'red'][i]}"></i>${t(b)} <b style="color:var(--text)">${money(r.buckets[b])}</b></div>
          <div class="meter"><i style="width:${r.totals.remaining ? r.buckets[b] / r.totals.remaining * 100 : 0}%;background:var(--${['green', 'amber', 'orange', 'red'][i]})"></i></div></div>`).join('')}</div></section>
      <div class="panel tabs"><button class="tab ${byCust ? '' : 'active'}" data-act="odTab" data-tab="inv">${t('byInvoice')}</button><button class="tab ${byCust ? 'active' : ''}" data-act="odTab" data-tab="cust">${t('byCustomer')}</button></div>
      <section class="panel">${byCust
        ? table('overdueCust', custCols, custRows, { click: true, sortable: false, foot: footRow(custCols, { remaining: sumRem }, t('all')) })
        : table('overdue', invCols, rows, { click: true, sortable: false, foot: footRow(invCols, { remaining: sumRem, amount: rows.reduce((a, x) => a + x.amount, 0) }, t('all')) })}</section>`;
  } else if (view === 'followup') {
    const r = await call('getFollowUpBoard', f);
    if (S.view !== view) return;
    setBadge('followup', r.totals.customers);
    S.rows.followCards = r.customers;
    out().innerHTML = `<section class="stats">
        ${stat(t('overdueCustomers'), r.totals.customers, '♙', 'red')}${stat(t('overdueAmt'), `${short(r.totals.remaining)} <small>${esc(cur())}</small>`, '!', 'amber')}
        ${stat(t('promisesDue'), r.promisesDue, '☎', '')}</section>
      ${r.customers.length ? `<div class="risk-grid">${r.customers.map((c, i) => `
        <article class="panel risk-item">
          <div class="card-head">${daysPill(c.maxDays)}<small style="color:var(--subtle)">${esc(c.account)}</small></div>
          <h3>${esc(c.name)}</h3>
          <p>${t('f_collector')}: ${esc(collectorName(c.collector))}</p>
          <div class="mini-stats"><div><span>${t('overdueAmt')}</span><b>${money(c.remaining)}</b></div><div><span>${t('invoices')}</span><b>${c.count}</b></div></div>
          <p>${t('lastFollowUp')}: ${esc(c.lastFollowUp || '—')}${c.promiseDate ? `<br>${t('f_promiseDate')}: <b style="color:var(--text)">${esc(c.promiseDate)}</b>` : ''}</p>
          <div class="card-actions">
            ${can('add') ? btn('newFollow', '☎ ' + t('logAction'), 'button-primary', `data-acc="${esc(c.account)}"`) : ''}
            ${btn('openCust', t('statement'), 'button-ghost', `data-acc="${esc(c.account)}"`)}
            ${c.phone ? `<a class="button-ghost" style="display:inline-grid;place-items:center;text-decoration:none" href="tel:${esc(c.phone)}">${t('call')}</a>` : ''}
            ${c.email ? `<a class="button-ghost" style="display:inline-grid;place-items:center;text-decoration:none" href="mailto:${esc(c.email)}">${t('mail')}</a>` : ''}
          </div></article>`).join('')}</div>` : `<div class="panel empty">${t('noOverdue')}</div>`}`;
  } else if (view === 'collection') {
    const r = await call('reportCollection', f);
    if (S.view !== view) return;
    S.rows.collectors = r.rows;
    const flat = [];
    r.rows.forEach(m => m.companies.forEach(c => flat.push(Object.assign({ collector: m.collector }, c))));
    const cols = [{ k: 'collector', l: t('f_collector'), f: v => esc(collectorName(v)) }, { k: 'name', l: t('f_name'), cls: 'wrap' }, { k: 'account', l: t('f_account') },
      { k: 'balance', l: t('balance'), num: true }, { k: 'remaining', l: t('overdueAmt'), num: true }, { k: 'count', l: t('invoices') },
      { k: 'maxDays', l: t('maxDays'), f: daysPill }, { k: 'lastFollowUp', l: t('lastFollowUp') }];
    S.exportData = { name: 'collection_team', cols, rows: flat };
    out().innerHTML = `<section class="stats">
        ${stat(t('receivable'), `${short(r.totals.balance)} <small>${esc(cur())}</small>`, '$', '')}
        ${stat(t('overdueAmt'), `${short(r.totals.overdue)} <small>${esc(cur())}</small>`, '!', 'red')}
        ${stat(t('collectedMTD'), `${short(r.totals.collectedMTD)} <small>${esc(cur())}</small>`, '✓', 'green')}</section>
      <div class="section-head" style="padding:0 0 10px;border:0"><h2 class="section-title">${t('team')}</h2></div>
      <div class="risk-grid">${r.rows.map((m, i) => `
        <article class="panel risk-item">
          <div class="card-head"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${esc((m.name || '?')[0].toUpperCase())}</div>
            <div><h3 style="margin:0">${esc(m.name || t('unassigned'))}</h3><p style="margin:0">${m.customers} ${t('companies')}</p></div></div>
            ${m.maxDays ? daysPill(m.maxDays) : pill('0', 'healthy')}</div>
          <div class="mini-stats">
            <div><span>${t('balance')}</span><b>${short(m.balance)}</b></div><div><span>${t('overdueAmt')}</span><b class="neg">${short(m.overdue)}</b></div>
            <div><span>${t('overdueCustomers')}</span><b>${m.overdueCustomers}</b></div><div><span>${t('avgDays')}</span><b>${m.avgDays}</b></div>
            <div><span>${t('overdueInvoices')}</span><b>${m.overdueInvoices}</b></div><div><span>${t('collectedMTD')}</span><b class="pos">${short(m.collectedMTD)}</b></div></div>
          <p>${t('overdueAmt')} ${m.balance > 0 ? Math.round(m.overdue / m.balance * 100) : 0}% ${t('ofBalance')}</p>
          <div class="meter"><i style="width:${m.balance > 0 ? Math.min(100, m.overdue / m.balance * 100) : 0}%"></i></div>
          <div class="card-actions">${btn('collCompanies', t('companiesOf'), 'button-ghost', `data-i="${i}"`)}</div>
        </article>`).join('')}</div>
      <section class="panel section"><div class="section-head"><h2 class="section-title">${t('allCompanies')}</h2></div>
        ${table('collFlat', cols, flat, { click: true, sortable: false })}</section>`;
  }
}

function groupCustomers(rows) {
  const m = {};
  rows.forEach(r => {
    const c = m[r.account] = m[r.account] || { account: r.account, name: r.name, collector: r.collector, phone: r.phone, count: 0, remaining: 0, maxDays: 0, lastFollowUp: r.lastFollowUp, promiseDate: r.promiseDate };
    c.count++; c.remaining += r.remaining; c.maxDays = Math.max(c.maxDays, r.days);
  });
  return Object.values(m).sort((a, b) => b.remaining - a.remaining);
}

// ───────── Import ─────────
const IMP = { rows: null };
function readImportFile(file) {
  if (typeof XLSX === 'undefined') { toast(t('xlsxMissing'), 'error'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });
    // google.script.run cannot send Date objects → convert to strings.
    IMP.rows = raw.map(r => {
      const o = {};
      Object.keys(r).forEach(k => {
        const v = r[k];
        o[k] = v instanceof Date ? ymd(v) + ' ' + z(v.getHours()) + ':' + z(v.getMinutes()) : v;
      });
      return o;
    });
    const heads = IMP.rows.length ? Object.keys(IMP.rows[0]) : [];
    const sample = IMP.rows.slice(0, 5);
    $('#impPreview').innerHTML = `<section class="panel section">
      <div class="section-head"><h2 class="section-title">${t('previewTitle')}</h2><span class="badge blue">${t('rowsFound')}: ${IMP.rows.length}</span></div>
      <div class="table-wrap"><table><thead><tr>${heads.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${sample.map(r => '<tr>' + heads.map(h => `<td>${esc(r[h])}</td>`).join('') + '</tr>').join('')}</tbody></table></div></section>`;
    $('#impRun').disabled = !IMP.rows.length;
  };
  reader.readAsArrayBuffer(file);
}

async function runImport() {
  const entity = $('#impEntity').value, mode = $('#impMode').value;
  if (!IMP.rows || !IMP.rows.length) return;
  if (mode === 'replace' && !confirm(t('replace') + ' — ' + t('confirmDelete'))) return;
  const b = $('#impRun'); b.disabled = true;
  const total = { inserted: 0, updated: 0, skipped: 0 };
  const size = 2000;
  try {
    for (let i = 0; i < IMP.rows.length; i += size) {
      b.textContent = `${t('importNow')} ${Math.min(i + size, IMP.rows.length)}/${IMP.rows.length}`;
      const r = await call('importRows', entity, IMP.rows.slice(i, i + size), i === 0 ? mode : (mode === 'replace' ? 'append' : mode));
      total.inserted += r.inserted; total.updated += r.updated; total.skipped += r.skipped;
    }
    toast(t('importedMsg', { i: total.inserted, u: total.updated, s: total.skipped }));
    await refreshLookups();
  } finally { b.disabled = false; b.textContent = t('importNow'); }
}

// ───────── Export ─────────
function exportCsv() {
  const d = S.exportData;
  if (!d || !d.rows.length) { toast(t('noData'), 'error'); return; }
  const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [d.cols.map(c => q(c.l)).join(',')].concat(d.rows.map(r => d.cols.map(c => q(r[c.k])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = d.name + '_' + today() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

// ───────── Events ─────────
const ACT = {
  menu() { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('open'); },
  theme() { const l = !document.documentElement.classList.contains('light'); document.documentElement.classList.toggle('light', l); store.set('crm_theme', l ? 'light' : 'dark'); },
  lang() { store.set('crm_lang', S.lang === 'ar' ? 'en' : 'ar'); applyPrefs(); if (S.user) { renderShell(); go(S.view); } else renderLogin(); },
  async logout() { try { await run('logout', S.token); } catch (e) {} signOutLocal(); },
  closeDrawer,
  export: exportCsv,
  print() { window.print(); },
  runReport,
  page(el) { const v = el.closest('.pager').dataset.view; listState(v).page = +el.dataset.p; loadList(v); },
  newCustomer() { openForm('Customers', { status: 'Active', currency: cur(), termsDays: 30, collector: S.user.isCollector ? S.user.username : '' }, true); },
  newTx() { openForm('Transactions', { date: today(), type: 'Invoice', currency: cur(), exchange: 1 }, true); },
  newGroup() { openForm('CustomerGroups', {}, true); },
  newUser() { openForm('Users', { role: 'User', scope: 'all', active: true, pages: 'dashboard,customers' }, true); },
  newFollow(el) { openForm('FollowUps', { account: el.dataset.acc || '', actionDate: today(), actionType: 'Call', status: 'Open' }, true); },
  openCust(el) { openCustomer(el.dataset.acc); },
  custEdit(el) {
    call('listRecords', 'Customers', { filters: { account: el.dataset.acc }, pageSize: 5 }).then(r => r.rows[0] && openForm('Customers', r.rows[0], false));
  },
  stmtApply() { const tl = $('#stmtTools'); const v = readTools(tl); openCustomer(tl.dataset.acc, v.from, v.to, true); },
  rowEdit(el) { const { view, row } = rowOf(el); openForm(LISTS[view].entity, row, false); },
  async rowDelete(el) {
    const { view, row } = rowOf(el);
    if (!confirm(t('confirmDelete'))) return;
    await call('deleteRecord', LISTS[view].entity, row[LISTS[view].id]);
    toast(t('deleted'));
    if (['customers', 'groups', 'users'].indexOf(view) > -1) await refreshLookups();
    loadList(view);
  },
  async rowPost(el) { const { row } = rowOf(el); const n = await call('postTransactions', [row.rowId], false); toast(t('postedN', { n })); loadList('transactions'); },
  async rowUnpost(el) { const { row } = rowOf(el); const n = await call('postTransactions', [row.rowId], true); toast(t('unpostedN', { n })); loadList('transactions'); },
  async postSelected() {
    const ids = $$('[data-sel]:checked').map(i => i.dataset.sel);
    if (!ids.length) { toast(t('selectDraft'), 'error'); return; }
    const n = await call('postTransactions', ids, false);
    toast(t('postedN', { n })); loadList('transactions');
  },
  odTab(el) { S.rep.overdue.tab = el.dataset.tab; runReport(); },
  collCompanies(el) {
    const m = S.rows.collectors[+el.dataset.i];
    const cols = [{ k: 'name', l: t('f_name'), cls: 'wrap' }, { k: 'account', l: t('f_account') }, { k: 'balance', l: t('balance'), num: true },
      { k: 'remaining', l: t('overdueAmt'), num: true }, { k: 'count', l: t('invoices') }, { k: 'maxDays', l: t('maxDays'), f: daysPill }, { k: 'lastFollowUp', l: t('lastFollowUp') }];
    openDrawer(`<div class="drawer-head"><h2>${esc(m.name || t('unassigned'))} — ${t('companies')}</h2><button class="icon-button" data-act="closeDrawer">×</button></div>
      <div class="panel flush">${table('collDrawer', cols, m.companies, { click: true, sortable: false })}</div>`, true);
  },
  impTemplate() {
    const entity = $('#impEntity').value;
    call('getTemplateHeaders', entity).then(h => {
      S.exportData = { name: entity + '_template', cols: h.map(x => ({ k: x, l: x })), rows: [{}] };
      exportCsv();
    });
  },
  impRun: runImport
};

function rowOf(el) {
  const tbl = el.closest('table'), tr = el.closest('tr');
  const view = tbl.dataset.view;
  return { view, row: S.rows[view][+tr.dataset.i] };
}

// Rows that open the customer 360 drawer when clicked.
const ROW_CUSTOMER_VIEWS = ['customers', 'dashTop', 'balances', 'paid', 'overdue', 'overdueCust', 'collFlat', 'collDrawer'];

document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }
  const actEl = e.target.closest('[data-act]');
  if (actEl && ACT[actEl.dataset.act]) { e.preventDefault(); ACT[actEl.dataset.act](actEl, e); return; }
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const view = th.closest('table').dataset.view, s = listState(view);
    s.desc = s.sort === th.dataset.sort ? !s.desc : false; s.sort = th.dataset.sort; loadList(view); return;
  }
  if (e.target.closest('input,label,a,button,select')) return;
  const tr = e.target.closest('tbody tr[data-i]');
  if (tr) {
    const view = tr.closest('table').dataset.view;
    const row = (S.rows[view] || [])[+tr.dataset.i];
    if (row && ROW_CUSTOMER_VIEWS.indexOf(view) > -1) openCustomer(row.account);
  }
  if (e.target.id === 'overlay') closeDrawer();
});

let searchTimer;
document.addEventListener('input', e => {
  const tools = e.target.closest('[data-list]');
  if (tools && (e.target.type === 'search' || e.target.dataset.f === 'account')) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => onListTools(tools.dataset.list, tools), 400);
  }
});
document.addEventListener('change', e => {
  const tools = e.target.closest('[data-list]');
  if (tools && e.target.type !== 'search') { onListTools(tools.dataset.list, tools); return; }
  if (e.target.matches('[data-pagesize]')) {
    const v = e.target.closest('.pager').dataset.view, s = listState(v);
    s.pageSize = +e.target.value; s.page = 1; loadList(v); return;
  }
  if (e.target.id === 'impFile' && e.target.files[0]) readImportFile(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
  if (e.key === 'Enter' && e.target.id === 'gsearch') {
    const s = listState('customers'); s.q = e.target.value.trim(); s.page = 1; go('customers');
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') doLogin(e.target);
  else if (e.target.id === 'recForm') submitForm(e.target);
  else if (e.target.id === 'settingsForm') {
    const fd = {}; ['AppName', 'CompanyName', 'LocalCurrency'].forEach(k => { fd[k] = e.target.elements[k].value.trim(); });
    S.settings = await call('saveSettings', fd); toast(t('settingsSaved')); renderShell(); go('users');
  }
});

// ───────── Boot ─────────
(async function boot() {
  applyPrefs();
  const tok = store.get('crm_token');
  if (tok) {
    try { setLoading(1); onLogin(await run('resume', tok)); return; }
    catch (e) { store.set('crm_token', null); }
    finally { setLoading(-1); }
  }
  renderLogin();
})();
</script>
